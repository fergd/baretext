<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'" />
    <title>Baretext</title>
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/shell.css" />
    <link rel="stylesheet" href="styles/manuscript.css" />
    <link rel="stylesheet" href="styles/spine.css" />
    <link rel="stylesheet" href="styles/sprint.css" />
    <link rel="stylesheet" href="styles/outline.css" />
    <link rel="stylesheet" href="styles/corkboard.css" />
    <link rel="stylesheet" href="styles/cold.css" />
    <link rel="stylesheet" href="styles/notes.css" />
    <link rel="stylesheet" href="styles/typewriter.css" />
    <link rel="stylesheet" href="styles/toolbar.css" />
    <link rel="stylesheet" href="styles/palette.css" />
    <link rel="stylesheet" href="styles/find.css" />
    <link rel="stylesheet" href="styles/history.css" />
    <link rel="stylesheet" href="styles/appearance.css" />
    <link rel="stylesheet" href="styles/export.css" />
    <script src="renderer.js" defer></script>
  </head>
  <body>
    <div class="bt-app" data-mode="manuscript">
      <header class="bt-chrome">
        <button type="button" class="bt-chrome-button" data-ref="sidebar" aria-label="Show outline" aria-pressed="false" title="Outline  ⌘\"><svg class="bt-sidebar-icon" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M6 3v10"/><rect class="bt-sidebar-pane" x="2.6" y="3.6" width="3.4" height="8.8" rx="1.2" fill="currentColor" stroke="none"/><path class="bt-sidebar-chevron" d="M11 6.5L9.5 8 11 9.5"/></svg></button>
        <span class="bt-chrome-title" data-ref="title"></span>
        <span class="bt-chrome-crumb" data-ref="crumb"></span>
        <button type="button" class="bt-chrome-button bt-chrome-notes" data-ref="notes-button" aria-label="Show notes" aria-pressed="false" title="Notes  ⇧⌘N"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3.5h10v7H8l-3 2.5v-2.5H3z"/><path class="bt-notes-icon-lines" d="M5.5 6h5M5.5 8h3"/></svg><span class="bt-notes-badge" data-ref="notes-badge"></span></button>
      </header>
      <main class="bt-workspace" data-ref="workspace">
        <nav class="bt-spine" data-ref="spine" aria-label="Scenes"></nav>
        <div class="bt-parked-bar" data-ref="parked-bar" role="region" aria-label="Cold Storage scene">
          <span class="bt-parked-label" data-ref="parked-label">Cold Storage</span>
          <span class="bt-parked-name" data-ref="parked-name"></span>
          <button type="button" class="bt-parked-button" data-ref="parked-restore">Restore</button>
          <button type="button" class="bt-parked-button" data-ref="parked-back">Back to manuscript<kbd>Esc</kbd></button>
        </div>
        <div class="bt-scroller" data-ref="scroller">
          <div class="bt-page" data-ref="page"></div>
        </div>
        <div class="bt-vignette bt-vignette-left" aria-hidden="true"></div>
        <div class="bt-vignette bt-vignette-right" aria-hidden="true"></div>
        <div class="bt-tw-guide bt-tw-guide-left" aria-hidden="true"></div>
        <div class="bt-tw-guide bt-tw-guide-right" aria-hidden="true"></div>
      </main>
      <footer class="bt-status">
        <div class="bt-status-group">
          <span data-ref="words">0 words</span>
          <button type="button" class="bt-toggle" data-ref="typewriter" role="switch" aria-checked="false" title="⌘⇧T"><span class="bt-switch" aria-hidden="true"><span class="bt-switch-knob"></span></span>Typewriter</button>
          <button type="button" class="bt-focus-button" data-ref="focus" title="Focus mode: the page alone (⌘.)"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="2.25"/></svg>Focus</button>
        </div>
        <div class="bt-status-group">
          <span class="bt-save-state" data-ref="save-state"></span>
          <button type="button" data-ref="filename" title="Reveal in Finder"></button>
        </div>
      </footer>
      <div class="bt-toast" role="status" aria-live="polite" data-ref="toast"></div>
    </div>
  </body>
</html>

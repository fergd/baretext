<!-- @dsCard group="Colors" viewport="700x160" subtitle="accent, selection & cursor in context" name="Accent in use" -->
<link rel="stylesheet" href="../styles.css">
<div data-theme="dark" style="font-family:var(--font-mono);background:var(--bg);padding:20px;color:var(--text);font-size:14px;line-height:1.9;">
  <span style="color:var(--accent);font-weight:700;">Chapter 1</span> &nbsp; a line of prose with a <span style="background:var(--sel);">selected phrase</span> and the<span style="display:inline-block;width:2px;height:1.05em;background:var(--cursor);vertical-align:text-bottom;margin:0 1px;"></span>cursor.
  <div style="margin-top:14px;display:flex;gap:8px;font-size:11px;color:var(--text-dim);">
    <span style="padding:3px 9px;border-radius:6px;background:var(--wash-accent-strong);color:var(--text);">accent wash</span>
    <span style="padding:3px 9px;border-radius:6px;box-shadow:var(--stripe-accent);background:var(--wash-accent);">active stripe</span>
  </div>
</div>

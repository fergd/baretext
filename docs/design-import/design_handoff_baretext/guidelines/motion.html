<!-- @dsCard group="Brand" viewport="700x160" subtitle="slow theme wash, crisp panels, quick micro" name="Motion" -->
<link rel="stylesheet" href="../styles.css">
<style>@keyframes bt-fill{0%{width:6%}50%{width:94%}100%{width:6%}}</style>
<div data-theme="dark" style="font-family:var(--font-mono);background:var(--bg);padding:20px;color:var(--text-dim);font-size:11px;display:flex;flex-direction:column;gap:12px;">
  <div style="display:flex;justify-content:space-between;"><span style="color:var(--text);">theme wash</span><span>0.35s ease — deliberately slow</span></div>
  <div style="display:flex;justify-content:space-between;"><span style="color:var(--text);">panel open</span><span>0.2s cubic-bezier(.16,1,.3,1)</span></div>
  <div style="display:flex;justify-content:space-between;"><span style="color:var(--text);">micro (hover/press)</span><span>0.08–0.12s ease</span></div>
  <div style="height:3px;border-radius:2px;background:color-mix(in srgb,var(--border) 60%,transparent);overflow:hidden;"><div style="height:100%;width:6%;background:var(--accent);animation:bt-fill 3.6s var(--ease-panel) infinite;"></div></div>
</div>

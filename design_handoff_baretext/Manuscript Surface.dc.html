<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  .stage{
    --bg:#242424;--bg-alt:#191919;--text:#faf2d6;--text-dim:#bdae93;--text-dimmer:#5a5040;
    --accent:#f8c537;--scene:#d98a3f;--border:#3a3a3a;
    --serif:'JetBrains Mono',ui-monospace,monospace;
    --gutter:88px;   /* right-aligned number column */
    --gap:40px;      /* gutter → text */
    --measure:60ch;
  }
  .stage[data-theme="parchment"]{--bg:#f5f0e8;--bg-alt:#ede8de;--text:#2a2218;--text-dim:#6b5f4a;--text-dimmer:#b0a898;--accent:#b8820a;--scene:#a8631a;--border:#d0c8b8;}
  .stage[data-theme="grove"]{--bg:#2f383e;--bg-alt:#272f34;--text:#d3c6aa;--text-dim:#9aa79d;--text-dimmer:#859289;--accent:#a7c080;--scene:#e69875;--border:#525c62;}
  .stage[data-theme="amstrad"]{--bg:#0d130d;--bg-alt:#0a0f0a;--text:#c8e6b0;--text-dim:#5f7a55;--text-dimmer:#2d3d29;--accent:#7dc45a;--scene:#7dc45a;--border:#1c281a;}
  .stage[data-theme="dracula"]{--bg:#282a36;--bg-alt:#21222c;--text:#f8f8f2;--text-dim:#6272a4;--text-dimmer:#44475a;--accent:#bd93f9;--scene:#8be9fd;--border:#44475a;}
  /* not enough left margin to hang the numbers — drop the chapter/scene aside entirely */
  @media (max-width:900px){ .gutter-num{ display:none; } }
</style>
</helmet>
<div class="stage" data-theme="{{ theme }}" style="min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--serif);transition:background .35s ease,color .35s ease;">

  <!-- theme row (design harness only — not part of the surface) -->
  <div style="position:sticky;top:0;z-index:10;display:flex;gap:6px;justify-content:flex-end;padding:12px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--border);font-family:ui-monospace,monospace;">
    <sc-for list="{{ themes }}" as="t" hint-placeholder-count="5">
      <button type="button" onClick="{{ t.pick }}" style="{{ t.style }}">{{ t.name }}</button>
    </sc-for>
  </div>

  <!-- MANUSCRIPT — text measure is centered in the viewport; numbers hang left into the margin -->
  <div style="max-width:var(--measure);margin:0 auto;padding:72px 40px 40vh;">

    <!-- Chapter -->
    <div style="position:relative;margin-bottom:8px;">
      <div class="gutter-num" style="position:absolute;right:calc(100% + var(--gap));top:0;width:var(--gutter);text-align:right;font-size:56px;font-weight:400;line-height:1.05;color:var(--text-dimmer);font-variant-numeric:lining-nums;">1</div>
      <h1 style="{{ chapterTitleStyle }}">{{ chapterTitle }}</h1>
    </div>

    <!-- Named scene -->
    <div style="position:relative;margin-top:40px;">
      <div class="gutter-num" style="position:absolute;right:calc(100% + var(--gap));top:0;width:var(--gutter);text-align:right;font-size:28px;font-weight:400;line-height:1.1;color:var(--text-dimmer);font-variant-numeric:lining-nums;">1.1</div>
      <h2 style="font-size:28px;font-weight:400;line-height:1.1;color:var(--text-dim);">It Begins</h2>
    </div>

    <sc-for list="{{ scene1 }}" as="p" hint-placeholder-count="2">
      <p style="font-size:19px;line-height:1.65;margin-top:24px;color:var(--text);text-wrap:pretty;">{{ p }}</p>
    </sc-for>

    <!-- Unnamed scene → ornament divider (number hangs in the gutter) -->
    <div style="position:relative;margin-top:38px;display:flex;align-items:center;justify-content:center;min-height:28px;">
      <div class="gutter-num" style="position:absolute;right:calc(100% + var(--gap));top:0;width:var(--gutter);text-align:right;font-size:28px;font-weight:400;line-height:1.1;color:var(--text-dimmer);font-variant-numeric:lining-nums;">1.2</div>
      <div aria-hidden="true" style="display:flex;align-items:center;justify-content:center;gap:14px;color:var(--scene);">
        <span style="height:1px;width:76px;background:currentColor;opacity:.5;"></span>
        <span style="width:9px;height:9px;border:1.5px solid currentColor;border-radius:50%;"></span>
        <span style="height:1px;width:76px;background:currentColor;opacity:.5;"></span>
      </div>
    </div>

    <sc-for list="{{ scene2 }}" as="p" hint-placeholder-count="2">
      <p style="font-size:19px;line-height:1.65;margin-top:24px;color:var(--text);text-wrap:pretty;">{{ p }}</p>
    </sc-for>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:900}}">
class Component extends DCLogic {
  state = { theme: 'dark', chapterName: 'Maples in Suburbia' };
  renderVals() {
    const { theme, chapterName } = this.state;
    const titled = chapterName && chapterName.trim();
    const base = "font-size:56px;font-weight:700;line-height:1.05;letter-spacing:-.01em;";
    const tb = (id) => `font-family:ui-monospace,monospace;font-size:11px;padding:5px 11px;border-radius:6px;cursor:pointer;border:1px solid ${theme===id?'transparent':'var(--border)'};background:${theme===id?'var(--accent)':'transparent'};color:${theme===id?'var(--bg)':'var(--text-dim)'};font-weight:${theme===id?700:400};`;
    return {
      theme,
      chapterTitle: titled ? chapterName.trim() : 'Untitled',
      chapterTitleStyle: base + (titled ? "color:var(--accent);" : "color:var(--text-dimmer);font-style:italic;font-weight:400;"),
      themes: [['dark','Ember'],['parchment','Parchment'],['amstrad','Amstrad'],['grove','Grove'],['dracula','Dracula']].map(([id,name]) => ({
        name, style: tb(id), pick: () => this.setState({ theme: id }),
      })),
      scene1: [
        "They spray the insecticides. Then pesticides. They don't need them. Aphids on the tomatoes? Plant basil. Or marigolds. The aphids stay away and it looks good, too. Same with carrots and onions. Onions keep the carrot flies off. Carrots keep the onion flies off. The people who lived here first knew this. They planted beans with maize and squash. The corn held the beans up. The beans fed the soil. The squash leaves shaded the weeds and kept the ground moist. You need that out here in the west.",
        "But now it's about control. Look at any suburb. Any strip mall. Green grass kept green with too much water. Too much fertilizer. Most of it runs off. It goes downstream and damages things. This is dry country. They plant things that don't belong. But it looks nice, I guess. Or it's what's expected.",
        "An old lady stared at Zyanya.",
        "\"Second aisle, halfway down.\"",
      ],
      scene2: [
        "The woman uneasily pivoted and waddled away, disappearing behind an end cap of plastic pots.",
        "Zyanya resumed watering a row of penstemons. She waved the wand slowly, back and forth, in a silent rhythm, soaking through the flimsy plastic pots, water spattering on the floor. The diffused bright sunlight radiated through the clear, corrugated roof.",
      ],
    };
  }
}
</script>
</body>
</html>

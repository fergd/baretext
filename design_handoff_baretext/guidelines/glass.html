<!-- @dsCard group="Brand" viewport="700x180" subtitle="translucent glass over whatever is behind" name="Glass panel" -->
<link rel="stylesheet" href="../styles.css">
<div data-theme="dark" style="position:relative;font-family:var(--font-mono);background:var(--bg);padding:24px;overflow:hidden;">
  <div style="position:absolute;top:-20px;left:40px;width:140px;height:140px;border-radius:50%;background:var(--accent);opacity:.5;filter:blur(6px);"></div>
  <div style="position:absolute;bottom:-30px;right:80px;width:120px;height:120px;border-radius:50%;background:#e0592a;opacity:.4;filter:blur(6px);"></div>
  <div style="position:relative;max-width:360px;margin:0 auto;background:var(--glass-bg);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--glass-border);border-top:1px solid var(--glass-edge);border-radius:var(--radius-palette);box-shadow:var(--shadow-palette),var(--glass-highlight);padding:16px 18px;color:var(--text);">
    <div style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600;">glass panel</div>
    <div style="font-size:12px;color:var(--text-dim);margin-top:8px;line-height:1.6;">86% bg-alt · blur(22px) saturate(160%) · accent top edge · inset highlight line</div>
  </div>
</div>

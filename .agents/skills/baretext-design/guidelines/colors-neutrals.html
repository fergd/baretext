<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals" subtitle="Cool-charcoal surface ramp, dark-first" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--surface-canvas);color:var(--text-title);font-family:var(--font-mono);padding:20px}
  .row{display:flex;align-items:center;gap:12px}
  .wrap{display:flex;flex-wrap:wrap;gap:12px}
  .lbl{font-size:11px;color:var(--text-meta);letter-spacing:.04em}
  .mono{font-variant-numeric:tabular-nums}
</style></head><body><div class="wrap">
<div style="display:flex;flex-direction:column;gap:6px">
  <div style="width:104px;height:56px;border-radius:12px;background:var(--bt-ink-0);border:1px solid var(--border-subtle)"></div>
  <div class="lbl">canvas</div><div class="lbl mono" style="color:var(--text-faint)">#0e1113</div></div>
<div style="display:flex;flex-direction:column;gap:6px">
  <div style="width:104px;height:56px;border-radius:12px;background:var(--bt-ink-1);border:1px solid var(--border-subtle)"></div>
  <div class="lbl">panel</div><div class="lbl mono" style="color:var(--text-faint)">#171b1e</div></div>
<div style="display:flex;flex-direction:column;gap:6px">
  <div style="width:104px;height:56px;border-radius:12px;background:var(--bt-ink-2);border:1px solid var(--border-subtle)"></div>
  <div class="lbl">raised</div><div class="lbl mono" style="color:var(--text-faint)">#1c2124</div></div>
<div style="display:flex;flex-direction:column;gap:6px">
  <div style="width:104px;height:56px;border-radius:12px;background:var(--bt-ink-3);border:1px solid var(--border-subtle)"></div>
  <div class="lbl">inset</div><div class="lbl mono" style="color:var(--text-faint)">#21262a</div></div>
<div style="display:flex;flex-direction:column;gap:6px">
  <div style="width:104px;height:56px;border-radius:12px;background:var(--bt-ink-4);border:1px solid var(--border-subtle)"></div>
  <div class="lbl">border</div><div class="lbl mono" style="color:var(--text-faint)">#262c30</div></div>
<div style="display:flex;flex-direction:column;gap:6px">
  <div style="width:104px;height:56px;border-radius:12px;background:var(--bt-line);border:1px solid var(--border-subtle)"></div>
  <div class="lbl">line</div><div class="lbl mono" style="color:var(--text-faint)">#2a3033</div></div>
</div></body></html>

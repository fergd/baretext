<!-- @dsCard group="Elevation" viewport="700x170" name="Surfaces" subtitle="Elevation by tonal step, not shadow" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--surface-canvas);color:var(--text-title);font-family:var(--font-mono);padding:20px}
  .row{display:flex;align-items:center;gap:12px}
  .wrap{display:flex;flex-wrap:wrap;gap:12px}
  .lbl{font-size:11px;color:var(--text-meta);letter-spacing:.04em}
  .mono{font-variant-numeric:tabular-nums}
</style></head><body><div class="wrap" style="gap:14px;align-items:flex-end">
<div style="width:96px;height:60px;border-radius:12px;background:var(--surface-panel);border:1px solid var(--border-subtle);display:flex;align-items:flex-end;padding:6px"><span class="lbl">panel</span></div>
<div style="width:96px;height:60px;border-radius:12px;background:var(--surface-raised);display:flex;align-items:flex-end;padding:6px"><span class="lbl">raised</span></div>
<div style="width:96px;height:60px;border-radius:12px;background:var(--surface-inset);display:flex;align-items:flex-end;padding:6px"><span class="lbl">inset</span></div>
<div style="width:120px;height:60px;border-radius:16px;background:var(--surface-panel);box-shadow:var(--shadow-panel);display:flex;align-items:flex-end;padding:6px"><span class="lbl">rail · shadow</span></div>
</div></body></html>

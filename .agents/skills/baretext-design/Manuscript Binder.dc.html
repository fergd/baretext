<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; }
  a{ color:#ec9a63; text-decoration:none; }
  a:hover{ color:#f2b183; }
</style>
</helmet>

<div style="min-height:100vh; background:#0e1113; display:flex; justify-content:center; padding:44px 24px; font-family:'JetBrains Mono', ui-monospace, monospace;">
  <div style="width:100%; max-width:428px; background:#171b1e; border:1px solid #262c30; border-radius:20px; padding:16px 8px 16px; box-shadow:0 30px 70px -30px rgba(0,0,0,0.8); align-self:flex-start;">

    <!-- Section header -->
    <div style="display:flex; align-items:center; justify-content:space-between; padding:6px 12px 2px; margin-bottom:8px;">
      <span style="color:#9aa2a1; letter-spacing:2px; font-size:11.5px; font-weight:600;">MANUSCRIPT</span>
      <span style="display:flex; align-items:center; gap:6px; color:#8a9290; font-size:12px;">
        <span role="button" style="width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#8a9290; cursor:pointer; transition:background .12s,color .12s;" style-hover="background:rgba(226,229,228,0.09); color:#e2e5e4;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/></svg></span>
        <span style="font-variant-numeric:tabular-nums; padding-right:4px;">2 ch&nbsp;·&nbsp;8</span>
      </span>
    </div>

    <!-- Chapter timeline spine -->
    <div style="position:relative;">
    <!-- Chapter 1 -->
    <div style="margin-bottom:2px; position:relative;">
      <div style="position:absolute; left:20px; top:40px; bottom:4px; width:2px; border-radius:2px; background:{{ spineColor }}; pointer-events:none;"></div>
      <div onClick="{{ toggleCh1 }}" onMouseEnter="{{ ch1head.enter }}" onMouseLeave="{{ ch1head.leave }}" style="display:grid; grid-template-columns:16px 24px 1fr 64px; align-items:center; gap:8px; min-height:40px; padding:8px 12px; border-radius:12px; cursor:pointer; background:{{ ch1head.bg }}; transition:background .12s;">
        <span style="display:flex; justify-content:center; color:#7e8785; transform:rotate({{ ch1Deg }}deg); transition:transform .18s;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
        <span style="color:#8a9290; font-size:13px; text-align:center;">1</span>
        <span style="color:#eef1ef; font-weight:600; font-family:{{titleFont}}; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Warfare Winter</span>
        <span style="position:relative; height:30px; display:flex; align-items:center; justify-content:flex-end;">
          <span style="position:absolute; right:4px; color:#7c857d; font-size:12.5px; font-variant-numeric:tabular-nums; opacity:{{ ch1head.countOp }}; transform:{{ ch1head.countTf }}; transition:opacity .22s cubic-bezier(.4,0,.2,1), transform .22s cubic-bezier(.4,0,.2,1); pointer-events:none;">{{ ch1Meta }}</span>
          <span style="display:flex; gap:2px; opacity:{{ ch1head.actOp }}; transform:{{ ch1head.actTf }}; pointer-events:{{ ch1head.pe }}; transition:opacity .22s cubic-bezier(.4,0,.2,1), transform .22s cubic-bezier(.4,0,.2,1);">
            <span role="button" onClick="{{ stop }}" style="width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#8a9290; cursor:pointer; transition:background .12s,color .12s;" style-hover="background:rgba(226,229,228,0.09); color:#e2e5e4;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg></span>
            <span role="button" onClick="{{ stop }}" style="width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#8a9290; cursor:pointer; transition:background .12s,color .12s;" style-hover="background:rgba(226,229,228,0.09); color:#e2e5e4;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4.5h8V6"/><path d="M6 6l1 14h10l1-14"/></svg></span>
          </span>
        </span>
      </div>

      <sc-if value="{{ openCh1 }}" hint-placeholder-val="{{ true }}">
        <div style="position:relative; margin-left:0; padding-left:0;">
          <sc-for list="{{ ch1Scenes }}" as="item" hint-placeholder-count="6">
            <div onClick="{{ item.onSelect }}" onMouseEnter="{{ item.onEnter }}" onMouseLeave="{{ item.onLeave }}" style="display:grid; grid-template-columns:24px 1fr 64px; align-items:center; gap:8px; min-height:40px; padding:8px 12px; margin:1px 0 1px 24px; border-radius:12px; background:{{ item.rowBg }}; cursor:pointer; transition:background .12s;">
              <span style="opacity:{{ item.leadOpacity }}; color:#5c635f; display:flex; justify-content:center; transition:opacity .12s;"><svg width="10" height="16" viewBox="0 0 12 20" fill="currentColor"><circle cx="3.5" cy="4" r="1.4"/><circle cx="8.5" cy="4" r="1.4"/><circle cx="3.5" cy="10" r="1.4"/><circle cx="8.5" cy="10" r="1.4"/><circle cx="3.5" cy="16" r="1.4"/><circle cx="8.5" cy="16" r="1.4"/></svg></span>
              <span style="color:{{ item.titleColor }}; font-style:{{ item.titleFontStyle }}; font-family:{{titleFont}}; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ item.title }}</span>
              <span style="position:relative; height:30px; display:flex; align-items:center; justify-content:flex-end;">
                <span style="position:absolute; right:4px; color:{{ item.countColor }}; font-style:{{ item.countFontStyle }}; font-size:12.5px; font-variant-numeric:tabular-nums; opacity:{{ item.countOpacity }}; transform:{{ item.countTransform }}; transition:opacity .22s cubic-bezier(.4,0,.2,1), transform .22s cubic-bezier(.4,0,.2,1); pointer-events:none;">{{ item.countText }}</span>
                <span style="display:flex; gap:2px; opacity:{{ item.actionOpacity }}; transform:{{ item.actionTransform }}; pointer-events:{{ item.actionPE }}; transition:opacity .22s cubic-bezier(.4,0,.2,1), transform .22s cubic-bezier(.4,0,.2,1);">
                  <span role="button" onClick="{{ stop }}" style="width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#8a9290; cursor:pointer; transition:background .12s,color .12s;" style-hover="background:rgba(226,229,228,0.09); color:#e2e5e4;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg></span>
                  <span role="button" onClick="{{ stop }}" style="width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#8a9290; cursor:pointer; transition:background .12s,color .12s;" style-hover="background:rgba(226,229,228,0.09); color:#e2e5e4;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4.5h8V6"/><path d="M6 6l1 14h10l1-14"/></svg></span>
                </span>
              </span>
            </div>
          </sc-for>
          <div style="display:inline-flex; align-items:center; gap:8px; margin:3px 0 2px 56px; padding:7px 12px; border-radius:10px; color:{{accent}}; cursor:pointer; transition:background .12s;" style-hover="background:{{accentWash}};">
            <span style="display:flex;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg></span>
            <span style="font-size:13px; font-weight:500;">add scene</span>
          </div>
        </div>
      </sc-if>
    </div>

    <!-- Chapter 2 -->
    <div style="margin-bottom:2px; position:relative;">
      <div style="position:absolute; left:20px; top:40px; bottom:4px; width:2px; border-radius:2px; background:{{ spineColor }}; pointer-events:none;"></div>
      <div onClick="{{ toggleCh2 }}" onMouseEnter="{{ ch2head.enter }}" onMouseLeave="{{ ch2head.leave }}" style="display:grid; grid-template-columns:16px 24px 1fr 64px; align-items:center; gap:8px; min-height:40px; padding:8px 12px; border-radius:12px; cursor:pointer; background:{{ ch2head.bg }}; transition:background .12s;">
        <span style="display:flex; justify-content:center; color:#7e8785; transform:rotate({{ ch2Deg }}deg); transition:transform .18s;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
        <span style="color:#8a9290; font-size:13px; text-align:center;">2</span>
        <span style="color:#eef1ef; font-weight:600; font-style:italic; font-family:{{titleFont}}; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Chapter 2</span>
        <span style="position:relative; height:30px; display:flex; align-items:center; justify-content:flex-end;">
          <span style="position:absolute; right:4px; color:#7c857d; font-size:12.5px; font-variant-numeric:tabular-nums; opacity:{{ ch2head.countOp }}; transform:{{ ch2head.countTf }}; transition:opacity .22s cubic-bezier(.4,0,.2,1), transform .22s cubic-bezier(.4,0,.2,1); pointer-events:none;">{{ ch2Meta }}</span>
          <span style="display:flex; gap:2px; opacity:{{ ch2head.actOp }}; transform:{{ ch2head.actTf }}; pointer-events:{{ ch2head.pe }}; transition:opacity .22s cubic-bezier(.4,0,.2,1), transform .22s cubic-bezier(.4,0,.2,1);">
            <span role="button" onClick="{{ stop }}" style="width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#8a9290; cursor:pointer; transition:background .12s,color .12s;" style-hover="background:rgba(226,229,228,0.09); color:#e2e5e4;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg></span>
            <span role="button" onClick="{{ stop }}" style="width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#8a9290; cursor:pointer; transition:background .12s,color .12s;" style-hover="background:rgba(226,229,228,0.09); color:#e2e5e4;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4.5h8V6"/><path d="M6 6l1 14h10l1-14"/></svg></span>
          </span>
        </span>
      </div>

      <sc-if value="{{ openCh2 }}" hint-placeholder-val="{{ true }}">
        <div style="position:relative; margin-left:0; padding-left:0;">
          <sc-for list="{{ ch2Scenes }}" as="item" hint-placeholder-count="2">
            <div onClick="{{ item.onSelect }}" onMouseEnter="{{ item.onEnter }}" onMouseLeave="{{ item.onLeave }}" style="display:grid; grid-template-columns:24px 1fr 64px; align-items:center; gap:8px; min-height:40px; padding:8px 12px; margin:1px 0 1px 24px; border-radius:12px; background:{{ item.rowBg }}; cursor:pointer; transition:background .12s;">
              <span style="opacity:{{ item.leadOpacity }}; color:#5c635f; display:flex; justify-content:center; transition:opacity .12s;"><svg width="10" height="16" viewBox="0 0 12 20" fill="currentColor"><circle cx="3.5" cy="4" r="1.4"/><circle cx="8.5" cy="4" r="1.4"/><circle cx="3.5" cy="10" r="1.4"/><circle cx="8.5" cy="10" r="1.4"/><circle cx="3.5" cy="16" r="1.4"/><circle cx="8.5" cy="16" r="1.4"/></svg></span>
              <span style="color:{{ item.titleColor }}; font-style:{{ item.titleFontStyle }}; font-family:{{titleFont}}; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ item.title }}</span>
              <span style="position:relative; height:30px; display:flex; align-items:center; justify-content:flex-end;">
                <span style="position:absolute; right:4px; color:{{ item.countColor }}; font-style:{{ item.countFontStyle }}; font-size:12.5px; font-variant-numeric:tabular-nums; opacity:{{ item.countOpacity }}; transform:{{ item.countTransform }}; transition:opacity .22s cubic-bezier(.4,0,.2,1), transform .22s cubic-bezier(.4,0,.2,1); pointer-events:none;">{{ item.countText }}</span>
                <span style="display:flex; gap:2px; opacity:{{ item.actionOpacity }}; transform:{{ item.actionTransform }}; pointer-events:{{ item.actionPE }}; transition:opacity .22s cubic-bezier(.4,0,.2,1), transform .22s cubic-bezier(.4,0,.2,1);">
                  <span role="button" onClick="{{ stop }}" style="width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#8a9290; cursor:pointer; transition:background .12s,color .12s;" style-hover="background:rgba(226,229,228,0.09); color:#e2e5e4;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg></span>
                  <span role="button" onClick="{{ stop }}" style="width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#8a9290; cursor:pointer; transition:background .12s,color .12s;" style-hover="background:rgba(226,229,228,0.09); color:#e2e5e4;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4.5h8V6"/><path d="M6 6l1 14h10l1-14"/></svg></span>
                </span>
              </span>
            </div>
          </sc-for>
          <div style="display:inline-flex; align-items:center; gap:8px; margin:3px 0 2px 56px; padding:7px 12px; border-radius:10px; color:{{accent}}; cursor:pointer; transition:background .12s;" style-hover="background:{{accentWash}};">
            <span style="display:flex;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg></span>
            <span style="font-size:13px; font-weight:500;">add scene</span>
          </div>
        </div>
      </sc-if>
    </div>

    </div>

    <!-- Cold Storage -->
    <div style="background:#1c2124; border-radius:16px; padding:4px 0 6px; margin-top:8px;">
      <div onClick="{{ toggleCold }}" style="display:grid; grid-template-columns:16px 24px 1fr 64px; align-items:center; gap:8px; min-height:40px; padding:8px 12px; border-radius:12px; cursor:pointer; transition:background .12s;" style-hover="background:rgba(226,229,228,0.04);">
        <span style="display:flex; justify-content:center; color:#7e8785; transform:rotate({{ coldDeg }}deg); transition:transform .18s;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
        <span style="display:flex; justify-content:center; color:#7fa6c4;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 3v18"/><path d="M4.2 7.5l15.6 9"/><path d="M19.8 7.5l-15.6 9"/></svg></span>
        <span style="color:#c9d0ce; font-weight:600; font-style:italic; font-family:{{titleFont}}; font-size:14px; letter-spacing:0.2px;">Cold Storage</span>
        <span style="text-align:right; color:#7c857d; font-size:12.5px; font-variant-numeric:tabular-nums; padding-right:4px;">{{ coldMeta }}</span>
      </div>

      <sc-if value="{{ openCold }}" hint-placeholder-val="{{ true }}">
        <div style="position:relative; margin-left:0; padding-left:0;">
          <div style="position:absolute; left:20px; top:4px; bottom:8px; width:2px; border-radius:2px; background:{{ coldGuide }}; pointer-events:none;"></div>
          <sc-for list="{{ coldScenes }}" as="item" hint-placeholder-count="1">
            <div onClick="{{ item.onSelect }}" onMouseEnter="{{ item.onEnter }}" onMouseLeave="{{ item.onLeave }}" style="display:grid; grid-template-columns:24px 1fr 64px; align-items:center; gap:8px; min-height:40px; padding:8px 12px; margin:1px 0 1px 24px; border-radius:12px; background:{{ item.rowBg }}; cursor:pointer; transition:background .12s;">
              <span style="opacity:{{ item.leadOpacity }}; color:#5c635f; display:flex; justify-content:center; transition:opacity .12s;"><svg width="10" height="16" viewBox="0 0 12 20" fill="currentColor"><circle cx="3.5" cy="4" r="1.4"/><circle cx="8.5" cy="4" r="1.4"/><circle cx="3.5" cy="10" r="1.4"/><circle cx="8.5" cy="10" r="1.4"/><circle cx="3.5" cy="16" r="1.4"/><circle cx="8.5" cy="16" r="1.4"/></svg></span>
              <span style="color:{{ item.titleColor }}; font-family:{{titleFont}}; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ item.title }}</span>
              <span style="position:relative; height:30px; display:flex; align-items:center; justify-content:flex-end;">
                <span style="position:absolute; right:4px; color:{{ item.countColor }}; font-size:12.5px; font-variant-numeric:tabular-nums; opacity:{{ item.countOpacity }}; transform:{{ item.countTransform }}; transition:opacity .22s cubic-bezier(.4,0,.2,1), transform .22s cubic-bezier(.4,0,.2,1); pointer-events:none;">{{ item.countText }}</span>
                <span style="display:flex; gap:2px; opacity:{{ item.actionOpacity }}; transform:{{ item.actionTransform }}; pointer-events:{{ item.actionPE }}; transition:opacity .22s cubic-bezier(.4,0,.2,1), transform .22s cubic-bezier(.4,0,.2,1);">
                  <span role="button" onClick="{{ stop }}" style="width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#8a9290; cursor:pointer; transition:background .12s,color .12s;" style-hover="background:rgba(226,229,228,0.09); color:#e2e5e4;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg></span>
                  <span role="button" onClick="{{ stop }}" style="width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#8a9290; cursor:pointer; transition:background .12s,color .12s;" style-hover="background:rgba(226,229,228,0.09); color:#e2e5e4;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4.5h8V6"/><path d="M6 6l1 14h10l1-14"/></svg></span>
                </span>
              </span>
            </div>
          </sc-for>
        </div>
      </sc-if>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:476,&quot;height&quot;:900},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:[&quot;#ec9a63&quot;,&quot;#7fb0a3&quot;,&quot;#c98bb0&quot;,&quot;#e0c27a&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Appearance&quot;},&quot;titles&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Mono&quot;,&quot;System&quot;],&quot;default&quot;:&quot;Mono&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Appearance&quot;}}">
class Component extends DCLogic {
  state = {
    openCh1: true, openCh2: true, openCold: true,
    selected: 'c2s2',
    hovered: null,
  };

  ch1 = [
    { id:'c1s1', title:'Scene 1', words:773 },
    { id:'c1s2', title:'January black ice', words:269 },
    { id:'c1s3', title:'Morning Coffee', words:995 },
    { id:'c1s4', title:'Oils & IVs', words:625 },
    { id:'c1s5', title:'January 22, 2031', words:795 },
    { id:'c1s6', title:'Gardening cannabis', words:1100 },
  ];
  ch2 = [
    { id:'c2s1', title:'January 23, 2031', words:458 },
    { id:'c2s2', title:'Scene 1', words:null, status:'draft' },
  ];
  cold = [
    { id:'cold1', title:'Scene 1', words:485 },
  ];

  // --- tiny color helpers so the accent tweak derives a coherent tonal set ---
  _p(h){ h=h.replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); return [0,2,4].map(i=>parseInt(h.substr(i,2),16)); }
  _h(rgb){ return '#'+rgb.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''); }
  mix(a,b,t){ const A=this._p(a),B=this._p(b); return this._h(A.map((v,i)=>v+(B[i]-v)*t)); }

  get tokens(){
    let A = this.props.accent;
    if (Array.isArray(A)) A = A[0];
    A = A || '#ec9a63';
    const surf = '#171b1e';
    return {
      accent: A,
      selBg: this.mix(A, surf, 0.82),      // M3 secondary-container: tonal accent over surface
      selTitle: this.mix(A, '#ffffff', 0.60),
      guideActive: this.mix(A, surf, 0.42),
      guideRest: '#2a3033',
      hover: 'rgba(226,229,228,0.055)',
      accentWash: this.mix(A, surf, 0.86),
    };
  }

  vm(list){
    const t = this.tokens;
    return list.map(s => {
      const sel = this.state.selected === s.id;
      const hov = this.state.hovered === s.id;
      const draft = s.words == null;
      return {
        title: s.title,
        rowBg: sel ? t.selBg : (hov ? t.hover : 'transparent'),
        titleColor: sel ? t.selTitle : (draft ? '#c4cac6' : '#d6dbd8'),
        titleFontStyle: draft ? 'italic' : 'normal',
        countText: draft ? s.status : s.words.toLocaleString(),
        countColor: draft ? t.accent : (sel ? t.accent : '#828b83'),
        countFontStyle: draft ? 'italic' : 'normal',
        countOpacity: hov ? 0 : 1,
        actionOpacity: hov ? 1 : 0,
        actionPE: hov ? 'auto' : 'none',
        leadOpacity: hov ? 1 : 0,
        countTransform: hov ? 'translateX(7px)' : 'translateX(0)',
        actionTransform: hov ? 'translateX(0)' : 'translateX(7px)',
        onEnter: () => this.setState({ hovered: s.id }),
        onLeave: () => this.setState({ hovered: null }),
        onSelect: () => this.setState({ selected: s.id }),
      };
    });
  }

  head(id){
    const on = this.state.hovered === id;
    return {
      enter: () => this.setState({ hovered: id }),
      leave: () => this.setState({ hovered: null }),
      bg: on ? this.tokens.hover : 'transparent',
      countOp: on ? 0 : 1,
      actOp: on ? 1 : 0,
      pe: on ? 'auto' : 'none',
      countTf: on ? 'translateX(7px)' : 'translateX(0)',
      actTf: on ? 'translateX(0)' : 'translateX(7px)',
    };
  }

  guide(prefix){
    const t = this.tokens;
    return (this.state.selected || '').indexOf(prefix) === 0 ? t.guideActive : t.guideRest;
  }

  renderVals(){
    const t = this.tokens;
    const titles = this.props.titles ?? 'Mono';
    const sum = a => a.reduce((n,s)=>n+(s.words||0),0);
    return {
      accent: t.accent,
      accentWash: t.accentWash,
      spineColor: t.guideActive,
      ch1Meta: this.ch1.length + '/' + sum(this.ch1),
      ch2Meta: this.ch2.length + '/' + sum(this.ch2),
      coldMeta: this.cold.length + '/' + sum(this.cold),
      titleFont: titles === 'System' ? 'ui-sans-serif, system-ui, sans-serif' : "'JetBrains Mono', ui-monospace, monospace",
      ch1Scenes: this.vm(this.ch1),
      ch2Scenes: this.vm(this.ch2),
      coldScenes: this.vm(this.cold),
      ch1Guide: this.guide('c1'),
      ch2Guide: this.guide('c2'),
      coldGuide: this.guide('cold'),
      openCh1: this.state.openCh1,
      openCh2: this.state.openCh2,
      openCold: this.state.openCold,
      ch1Deg: this.state.openCh1 ? 0 : -90,
      ch2Deg: this.state.openCh2 ? 0 : -90,
      coldDeg: this.state.openCold ? 0 : -90,
      ch1head: this.head('ch1head'),
      ch2head: this.head('ch2head'),
      toggleCh1: () => this.setState(s => ({ openCh1: !s.openCh1 })),
      toggleCh2: () => this.setState(s => ({ openCh2: !s.openCh2 })),
      toggleCold: () => this.setState(s => ({ openCold: !s.openCold })),
      stop: (e) => { if (e && e.stopPropagation) e.stopPropagation(); },
    };
  }
}
</script>
</body>
</html>

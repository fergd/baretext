<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline'">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.x/dist/tabler-icons.min.css">
  <title>Baretext</title>
  <style>
    /* ── IBM Plex fonts (local, no network) ── */
    @font-face { font-family: 'IBM Plex Mono'; font-weight: 400; font-style: normal;  src: url('fonts/ibm-plex-mono-400-normal.woff2') format('woff2'); }
    @font-face { font-family: 'IBM Plex Mono'; font-weight: 400; font-style: italic;  src: url('fonts/ibm-plex-mono-400-italic.woff2') format('woff2'); }
    @font-face { font-family: 'IBM Plex Mono'; font-weight: 700; font-style: normal;  src: url('fonts/ibm-plex-mono-700-normal.woff2') format('woff2'); }
    @font-face { font-family: 'IBM Plex Mono'; font-weight: 700; font-style: italic;  src: url('fonts/ibm-plex-mono-700-italic.woff2') format('woff2'); }

    @font-face { font-family: 'IBM Plex Serif'; font-weight: 400; font-style: normal; src: url('fonts/ibm-plex-serif-400-normal.woff2') format('woff2'); }
    @font-face { font-family: 'IBM Plex Serif'; font-weight: 400; font-style: italic; src: url('fonts/ibm-plex-serif-400-italic.woff2') format('woff2'); }
    @font-face { font-family: 'IBM Plex Serif'; font-weight: 700; font-style: normal; src: url('fonts/ibm-plex-serif-700-normal.woff2') format('woff2'); }
    @font-face { font-family: 'IBM Plex Serif'; font-weight: 700; font-style: italic; src: url('fonts/ibm-plex-serif-700-italic.woff2') format('woff2'); }

    @font-face { font-family: 'IBM Plex Sans'; font-weight: 400; font-style: normal;  src: url('fonts/ibm-plex-sans-400-normal.woff2') format('woff2'); }
    @font-face { font-family: 'IBM Plex Sans'; font-weight: 400; font-style: italic;  src: url('fonts/ibm-plex-sans-400-italic.woff2') format('woff2'); }
    @font-face { font-family: 'IBM Plex Sans'; font-weight: 700; font-style: normal;  src: url('fonts/ibm-plex-sans-700-normal.woff2') format('woff2'); }
    @font-face { font-family: 'IBM Plex Sans'; font-weight: 700; font-style: italic;  src: url('fonts/ibm-plex-sans-700-italic.woff2') format('woff2'); }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font-mono: 'IBM Plex Mono', 'SF Mono', 'Menlo', monospace;
      --font-serif: 'IBM Plex Serif', 'Georgia', serif;
      --font-sans: 'IBM Plex Sans', -apple-system, sans-serif;
      --editor-font: var(--font-mono);
    }

    /* ── DARK (original baretext dark) ── */
    [data-theme="dark"] {
      --bg: #242424;  --bg-alt: #191919;
      --text: #faf2d6; --text-dim: #bdae93; --text-dimmer: #5a5040;
      --accent: #f8c537; --border: #3a3a3a;
      --cursor: #f8c537; --sel: rgba(248,197,55,0.22); --placeholder: #5a5040;
    }

    /* ── LIGHT (warm parchment) ── */
    [data-theme="light"] {
      --bg: #f5f0e8;  --bg-alt: #ede8de;
      --text: #2a2218; --text-dim: #6b5f4a; --text-dimmer: #b0a898;
      --accent: #b8820a; --border: #d0c8b8;
      --cursor: #b8820a; --sel: rgba(184,130,10,0.20); --placeholder: #b0a898;
    }

    /* ── AYU DARK — deep blue-black, warm amber (ayu-theme) ── */
    [data-theme="ayu"] {
      --bg: #0f1419;  --bg-alt: #0d1016;
      --text: #e6e1cf; --text-dim: #5c6773; --text-dimmer: #2d3640;
      --accent: #f29718; --border: #1d2630;
      --cursor: #f29718; --sel: rgba(242,151,24,0.20); --placeholder: #2d3640;
    }

    /* ── DRACULA — purple midnight, vivid neons (draculatheme.com) ── */
    [data-theme="dracula"] {
      --bg: #282a36;  --bg-alt: #21222c;
      --text: #f8f8f2; --text-dim: #6272a4; --text-dimmer: #44475a;
      --accent: #bd93f9; --border: #44475a;
      --cursor: #f8f8f2; --sel: rgba(68,71,90,0.70); --placeholder: #44475a;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      /* Smooth theme transitions on root colors */
      transition: background 0.35s ease, color 0.35s ease;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: var(--bg);
      /* Theme color transitions ripple through the whole app */
      transition: background 0.35s ease;
    }

    #titlebar {
      height: 38px;
      flex-shrink: 0;
      -webkit-app-region: drag;
    }

    #editor-host {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    #editor-host .cm-editor { height: 100%; }
    #editor-host .cm-scroller { min-height: 100%; }
    /* editable surface fills the whole height, so the entire area is the writing space */
    #editor-host .cm-content { min-height: 100% !important; }

    /* typewriter mode: room so last lines can center */
    #app.typewriter .cm-content { padding-bottom: 50vh !important; }

    #statusbar {
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      flex-shrink: 0;
      border-top: 1px solid var(--border);
      background: var(--bg-alt);
      transition: background 0.35s ease, border-color 0.35s ease,
                  opacity 0.25s ease, transform 0.25s ease;
    }
    /* Focus mode: slide the statusbar down out of view */
    #statusbar.hidden {
      opacity: 0;
      transform: translateY(4px);
      pointer-events: none;
    }
    .status-group { display: flex; align-items: center; gap: 14px; }
    .status-item {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-dim);
      letter-spacing: 0.03em;
      transition: color 0.35s ease;
    }
    .status-item.dimmer { color: var(--text-dimmer); }

    #save-error {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #e05c5c;
      display: none;
      flex-shrink: 0;
    }
    #save-error.visible { display: block; }

    /* ===== Command palette ===== */
    #overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0);
      z-index: 9999;
      transition: background 0.22s ease;
    }
    #overlay.open  { display: block; }
    #overlay.visible { background: rgba(0,0,0,0.35); }
    [data-theme="light"] #overlay.visible { background: rgba(0,0,0,0.18); }

    /* Glass palette panel — uses theme vars for full theme expression */
    #palette {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(-14px);
      width: 580px;
      max-width: 93vw;
      /* Glass effect: theme bg at ~78% opacity, blur samples content behind */
      background: color-mix(in srgb, var(--bg-alt) 82%, transparent);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      border: 1px solid color-mix(in srgb, var(--border) 60%, transparent);
      border-radius: 14px;
      overflow: hidden;
      box-shadow:
        0 2px 0 0 color-mix(in srgb, var(--accent) 15%, transparent),
        0 28px 90px rgba(0,0,0,0.55),
        inset 0 1px 0 color-mix(in srgb, var(--text) 8%, transparent);
      opacity: 0;
      transition: opacity 0.16s ease, transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #overlay.visible #palette {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Search row */
    #palette-search-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 15px 18px;
      border-bottom: 1px solid color-mix(in srgb, var(--border) 50%, transparent);
    }
    #palette-search-icon {
      font-size: 16px;
      color: var(--text-dim);
      flex-shrink: 0;
      transition: color 0.2s;
    }
    #palette-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      caret-color: var(--cursor);
      font-family: var(--font-mono);
      font-size: 14px;
      padding: 0;
    }
    #palette-input::placeholder { color: var(--text-dimmer); }

    /* Scrollable list */
    #palette-list {
      max-height: 480px;
      overflow-y: auto;
      padding: 6px 0;
    }
    #palette-list::-webkit-scrollbar { width: 3px; }
    #palette-list::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--accent) 30%, transparent);
      border-radius: 2px;
    }

    /* Section labels — accent colored for theme expression */
    .p-section {
      padding: 10px 18px 4px;
      font-size: 10px;
      font-family: var(--font-mono);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      opacity: 0.7;
    }

    /* Items — box-shadow accent stripe, NO border-left (prevents text shift) */
    .pitem {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 18px;
      cursor: pointer;
      gap: 10px;
      transition: background 0.08s ease, box-shadow 0.08s ease;
      box-shadow: inset 3px 0 0 transparent;
    }
    .pitem:hover {
      background: color-mix(in srgb, var(--accent) 8%, transparent);
    }
    .pitem.active {
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .pitem-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }
    .pitem-icon {
      font-size: 15px;
      color: var(--text-dim);
      flex-shrink: 0;
      width: 18px;
      text-align: center;
      transition: color 0.15s;
    }
    .pitem.active .pitem-icon,
    .pitem:hover   .pitem-icon { color: var(--accent); }

    /* Default item label color — theme's text color */
    .pitem-label {
      font-size: 13px;
      font-family: var(--font-mono);
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      /* NO transform or position changes on active — text stays put */
    }

    /* kbd badges — use theme border/text colors */
    .pitem-kbd {
      display: flex;
      gap: 3px;
      flex-shrink: 0;
    }
    kbd.pkey {
      font-size: 11px;
      font-family: var(--font-mono);
      padding: 2px 6px;
      background: color-mix(in srgb, var(--bg) 60%, transparent);
      border: 1px solid color-mix(in srgb, var(--border) 80%, transparent);
      border-bottom-width: 2px;
      border-radius: 4px;
      color: var(--text-dim);
      line-height: 1.4;
    }

    /* Footer hints */
    #palette-footer {
      display: flex;
      gap: 16px;
      padding: 9px 18px;
      border-top: 1px solid color-mix(in srgb, var(--border) 40%, transparent);
    }
    .p-hint {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-dimmer);
    }
    kbd.phkey {
      font-size: 10px;
      font-family: var(--font-mono);
      padding: 1px 5px;
      background: color-mix(in srgb, var(--bg) 50%, transparent);
      border: 1px solid color-mix(in srgb, var(--border) 60%, transparent);
      border-bottom-width: 2px;
      border-radius: 3px;
      color: var(--text-dim);
    }

    /* ===== Font picker ===== */
    #font-picker {
      display: flex;
      position: fixed;
      bottom: 44px;
      left: 50%;
      transform: translateX(-50%) translateY(6px);
      background: color-mix(in srgb, var(--bg-alt) 88%, transparent);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
      border-radius: 8px;
      padding: 5px;
      gap: 2px;
      z-index: 50;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.16s ease, transform 0.16s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #font-picker.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }
    .fbtn {
      padding: 6px 16px;
      font-size: 12px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.12s ease, color 0.12s ease, transform 0.1s ease;
    }
    .fbtn:hover { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--text); transform: scale(1.04); }
    .fbtn:active { transform: scale(0.97); }
    .fbtn.active { background: var(--accent); color: var(--bg); font-weight: 600; }
    .fbtn.mono  { font-family: var(--font-mono); }
    .fbtn.serif { font-family: var(--font-serif); }
    .fbtn.sans  { font-family: var(--font-sans); }

    /* ===== Toast ===== */
    #toast {
      position: fixed;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%) translateY(8px) scale(0.96);
      background: color-mix(in srgb, var(--bg-alt) 90%, transparent);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid color-mix(in srgb, var(--border) 60%, transparent);
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 5px 14px;
      border-radius: 5px;
      opacity: 0;
      transition: opacity 0.16s ease, transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      z-index: 200;
      white-space: nowrap;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0) scale(1);
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--text-dimmer); border-radius: 2px; }
  </style>
</head>
<body>

<div id="app">
  <div id="titlebar"></div>
  <div id="editor-host"></div>
  <div id="statusbar">
    <div class="status-group">
      <span class="status-item" id="word-count">0 words</span>
      <span class="status-item dimmer" id="char-count">0 chars</span>
      <span class="status-item dimmer" id="md-mode">preview</span>
    </div>
    <div class="status-group">
      <div id="save-error" title="save failed"></div>
      <span class="status-item dimmer" id="file-name">untitled</span>
    </div>
  </div>
</div>

<div id="overlay">
  <div id="palette">
    <div id="palette-search-row">
      <i class="ti ti-search" id="palette-search-icon" aria-hidden="true"></i>
      <input id="palette-input" type="text" placeholder="type a command..." autocomplete="off" spellcheck="false">
    </div>
    <div id="palette-list"></div>
    <div id="palette-footer">
      <span class="p-hint"><kbd class="phkey">↑↓</kbd> navigate</span>
      <span class="p-hint"><kbd class="phkey">↵</kbd> select</span>
      <span class="p-hint"><kbd class="phkey">esc</kbd> close</span>
    </div>
  </div>
</div>

<div id="font-picker">
  <button class="fbtn mono active" data-font="mono">mono</button>
  <button class="fbtn serif" data-font="serif">serif</button>
  <button class="fbtn sans" data-font="sans">sans</button>
</div>

<div id="toast"></div>

<!-- CodeMirror bundle (local, no network) -->
<script src="editor-bundle.js"></script>
<script>
'use strict';

const app        = document.getElementById('app');
const host       = document.getElementById('editor-host');
const elWord     = document.getElementById('word-count');
const elChar     = document.getElementById('char-count');
const elFile     = document.getElementById('file-name');
const elSaveErr  = document.getElementById('save-error');
const overlay    = document.getElementById('overlay');
const pInput     = document.getElementById('palette-input');
const pList      = document.getElementById('palette-list');
const fontPicker = document.getElementById('font-picker');
const toastEl    = document.getElementById('toast');

const state = { theme: 'dark', font: 'mono', typewriter: false, focusMode: false, filePath: null, sourceMode: false };

const fontVars = {
  mono:  "'IBM Plex Mono', 'SF Mono', monospace",
  serif: "'IBM Plex Serif', 'Georgia', serif",
  sans:  "'IBM Plex Sans', -apple-system, sans-serif",
};

// ── Register app shortcuts with CodeMirror BEFORE creating the editor ──
// This prevents CM from swallowing ⌘K, ⌘S, etc.
window.BaretextEditor.registerKeys({
  'Mod-k':         () => openPalette(),
  'Mod-s':         () => cmdSave(),
  'Mod-n':         () => cmdNew(),
  'Mod-o':         () => cmdOpen(),
  'Mod-Shift-E':   () => cmdExport(),         // must be uppercase E
  'Mod-Shift-T':   () => toggleTypewriter(),  // must be uppercase T
  'Mod-Shift-F':   () => toggleFontPicker(),  // must be uppercase F
  'Mod-Shift-M':   () => toggleRenderedMode(), // markdown toggle
  'Mod-Shift-O':   () => openOutline(),        // outline navigation
  'Mod-Shift-Minus': () => insertSceneBreak(), // scene break — CM uses "Minus" not "-"
  'Mod-Period':    () => toggleFocus(),        // focus mode
});

// ── Create the CodeMirror editor ──
let view = window.BaretextEditor.create(
  host,
  '',
  (doc) => {
    updateCounts(doc);
    window.api.contentChanged(doc);
    if (state.typewriter) window.BaretextEditor.centerCursor(view);
  },
  'start writing...'
);

function getDoc()      { return window.BaretextEditor.getDoc(view); }
function setDoc(text)  { window.BaretextEditor.setDoc(view, text); }
function focusEditor() { window.BaretextEditor.focus(view); }

// ── IPC from main ──
window.api.onThemeChanged(() => {});
window.api.onFileLoaded(({ content, filePath, cursorPos }) => {
  if (content !== null && content !== undefined) setDoc(content);
  state.filePath = filePath;
  setFileName(filePath);
  updateCounts(getDoc());
  // Restore cursor to where the user left off; fall back to end of document
  requestAnimationFrame(() => {
    if (typeof cursorPos === 'number' && cursorPos >= 0) {
      window.BaretextEditor.setCursorPos(view, cursorPos);
    } else {
      window.BaretextEditor.cursorToEnd(view);
    }
    focusEditor();
  });
});
window.api.onAutoSaved(() => { elSaveErr.classList.remove('visible'); });
window.api.onSaveConfirmed(() => { elSaveErr.classList.remove('visible'); showToast('saved'); });

// Persist cursor position, debounced — fires on click, typing, arrow keys, etc.
let cursorSaveTimer = null;
function reportCursorPosition() {
  clearTimeout(cursorSaveTimer);
  cursorSaveTimer = setTimeout(() => {
    window.api.cursorChanged(window.BaretextEditor.getCursorPos(view));
  }, 400);
}
host.addEventListener('keyup', reportCursorPosition);
host.addEventListener('mouseup', reportCursorPosition);

// ── Fallback global shortcuts ──
// Fires when CM doesn't have focus (e.g. font picker open, palette closing)
document.addEventListener('keydown', (e) => {
  const mod = e.metaKey || e.ctrlKey;
  if (!mod) return;

  // Palette handles its own keys internally; don't double-fire
  if (overlay.classList.contains('open')) return;

  const key = e.key.toLowerCase();
  if (key === 'k')                        { e.preventDefault(); openPalette();       return; }
  if (key === 's')                        { e.preventDefault(); cmdSave();           return; }
  if (key === 'n')                        { e.preventDefault(); cmdNew();            return; }
  if (key === 'o' && !e.shiftKey)         { e.preventDefault(); cmdOpen();           return; }
  if (e.shiftKey && key === 'e')          { e.preventDefault(); cmdExport();         return; }
  if (e.shiftKey && key === 't')          { e.preventDefault(); toggleTypewriter();  return; }
  if (e.shiftKey && key === 'f')          { e.preventDefault(); toggleFontPicker();  return; }
  if (e.shiftKey && key === 'm')          { e.preventDefault(); toggleRenderedMode(); return; }
  if (e.shiftKey && key === 'o')          { e.preventDefault(); openOutline();       return; }
  if (e.shiftKey && (key === '-' || key === 'minus' || e.code === 'Minus')) { e.preventDefault(); insertSceneBreak(); return; }
  if (key === '.' || key === 'period')    { e.preventDefault(); toggleFocus();       return; }
});

// ── Theme ──
// Text/accent colors per theme — used to color theme names in the palette
const themeTextColors = {
  dark: '#faf2d6', light: '#2a2218',
  ayu: '#e6e1cf', dracula: '#f8f8f2',
};
const themeAccentColors = {
  dark: '#f8c537', light: '#b8820a',
  ayu: '#f29718', dracula: '#bd93f9',
};

function setTheme(t) {
  state.theme = t;
  const flash = document.createElement('div');
  flash.style.cssText = 'position:fixed;inset:0;opacity:0.35;z-index:99998;pointer-events:none;transition:opacity 0.3s ease;background:var(--bg);';
  document.body.appendChild(flash);
  requestAnimationFrame(() => {
    document.documentElement.setAttribute('data-theme', t);
    requestAnimationFrame(() => {
      flash.style.opacity = '0';
      setTimeout(() => flash.remove(), 350);
    });
  });
  window.api.setTheme(t === 'light' ? 'light' : 'dark');
  showToast('theme: ' + t);
  // Re-render palette immediately if open so active state + colors update
  if (overlay.classList.contains('open')) render(pInput.value);
}

// ── Font ──
function setFont(f) {
  state.font = f;
  document.documentElement.style.setProperty('--editor-font', fontVars[f]);
  document.querySelectorAll('.fbtn').forEach(b => b.classList.toggle('active', b.dataset.font === f));
}
document.querySelectorAll('.fbtn').forEach(btn => {
  btn.addEventListener('mousedown', (e) => {
    e.stopPropagation(); // prevent outside-click handler from closing before setFont fires
  });
  btn.addEventListener('click', () => {
    setFont(btn.dataset.font);
    fontPicker.classList.remove('open');
    focusEditor();
  });
});

// ── Scene break ──
function insertSceneBreak() {
  window.BaretextEditor.insertSceneBreak(view);
  showToast('scene break inserted');
}

// ── Markdown mode ──
// sourceMode false (default) = live preview: markdown syntax is concealed except
// on the line the cursor is on. sourceMode true = raw markdown always visible.
function toggleRenderedMode() {
  state.sourceMode = !state.sourceMode;
  // Apply mode change IMMEDIATELY so it's never out of sync with user actions
  window.BaretextEditor.setRenderedMode(view, state.sourceMode);
  // Cosmetic crossfade — opacity only, no state changes inside the timeout
  const scroller = host.querySelector('.cm-scroller');
  if (scroller) {
    scroller.style.transition = 'none';
    scroller.style.opacity = '0.4';
    requestAnimationFrame(() => {
      scroller.style.transition = 'opacity 0.2s ease';
      scroller.style.opacity = '1';
      setTimeout(() => { scroller.style.transition = ''; }, 220);
    });
  }
  const elMode = document.getElementById('md-mode');
  if (elMode) elMode.textContent = state.sourceMode ? 'source' : 'preview';
  showToast(state.sourceMode ? 'markdown visible' : 'markdown hidden');
}
function toggleTypewriter() {
  state.typewriter = !state.typewriter;
  const scroller = host.querySelector('.cm-scroller');
  if (scroller) {
    scroller.style.transition = 'opacity 0.2s ease';
    scroller.style.opacity = '0.4';
    setTimeout(() => {
      app.classList.toggle('typewriter', state.typewriter);
      if (state.typewriter) window.BaretextEditor.centerCursor(view);
      scroller.style.opacity = '1';
      setTimeout(() => { scroller.style.transition = ''; }, 220);
    }, 110);
  } else {
    app.classList.toggle('typewriter', state.typewriter);
    if (state.typewriter) window.BaretextEditor.centerCursor(view);
  }
  showToast(state.typewriter ? 'typewriter on' : 'typewriter off');
  focusEditor();
}

// ── Focus mode ──
function toggleFocus() {
  state.focusMode = !state.focusMode;
  document.getElementById('statusbar').classList.toggle('hidden', state.focusMode);
  showToast(state.focusMode ? 'focus mode on' : 'focus mode off');
}

// ── Status ──
function updateCounts(doc) {
  const t = doc || '';
  const w = t.trim() === '' ? 0 : t.trim().split(/\s+/).length;
  elWord.textContent = w + (w === 1 ? ' word' : ' words');
  elChar.textContent = t.length + (t.length === 1 ? ' char' : ' chars');
}
function setFileName(fp) { elFile.textContent = fp ? fp.split('/').pop() : 'untitled'; }

// ── Toast ──
let toastTimer = null;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1600);
}

// ── File commands ──
function cmdSave() { window.api.saveNow(getDoc()); }

async function cmdOpen() {
  closePalette(false); // don't refocus — dialog is opening
  const r = await window.api.openFile();
  if (r) {
    setDoc(r.content);
    state.filePath = r.filePath;
    setFileName(r.filePath);
    updateCounts(r.content);
  }
  focusEditor();
}

async function cmdNew() {
  closePalette(false);
  const r = await window.api.newFile();
  if (r) {
    setDoc('');
    state.filePath = r.filePath;
    setFileName(r.filePath);
    updateCounts('');
  }
  focusEditor();
}

async function cmdExport() {
  closePalette(false);
  const fp = await window.api.exportFile(getDoc());
  if (fp) showToast('exported');
  focusEditor();
}

async function cmdSaveDir() {
  closePalette(false);
  const dir = await window.api.chooseSaveDir();
  if (dir) showToast('save location set');
  focusEditor();
}

// ── Command palette ──
const commands = [
  { group: 'File',
    items: [
      { label: 'New file',           icon: 'ti-file-plus',       keys: ['⌘','N'],         fn: cmdNew },
      { label: 'Open file',          icon: 'ti-folder-open',     keys: ['⌘','O'],         fn: cmdOpen },
      { label: 'Save',               icon: 'ti-device-floppy',   keys: ['⌘','S'],         fn: cmdSave },
      { label: 'Export as Markdown', icon: 'ti-file-export',     keys: ['⌘','⇧','E'],    fn: cmdExport },
      { label: 'Set save location',  icon: 'ti-folder-pin',      keys: [],                fn: cmdSaveDir },
    ]
  },
  { group: 'Navigate',
    items: [
      { label: 'Jump to chapter or scene', icon: 'ti-list-search', keys: ['⌘','⇧','O'],   fn: openOutline, keepOpen: true },
    ]
  },
  { group: 'Insert',
    items: [
      { label: 'Scene break',        icon: 'ti-minus',           keys: ['⌘','⇧','—'],    fn: insertSceneBreak },
    ]
  },
  { group: 'View',
    items: [
      { label: 'Markdown: toggle symbols', icon: 'ti-markdown',     keys: ['⌘','⇧','M'],    fn: toggleRenderedMode },
      { label: 'Typewriter mode',          icon: 'ti-align-center', keys: ['⌘','⇧','T'],    fn: toggleTypewriter },
      { label: 'Change font',              icon: 'ti-typography',   keys: ['⌘','⇧','F'],    fn: toggleFontPicker },
      { label: 'Focus mode',               icon: 'ti-eye-off',      keys: ['⌘','.'],         fn: toggleFocus },
    ]
  },
  { group: 'Theme',
    items: [
      { label: 'Dark',    icon: 'ti-moon',    keys: [], themeKey: 'dark',    fn: () => setTheme('dark') },
      { label: 'Light',   icon: 'ti-sun',     keys: [], themeKey: 'light',   fn: () => setTheme('light') },
      { label: 'Ayu',     icon: 'ti-sunrise', keys: [], themeKey: 'ayu',     fn: () => setTheme('ayu') },
      { label: 'Dracula', icon: 'ti-ghost',   keys: [], themeKey: 'dracula', fn: () => setTheme('dracula') },
    ]
  },
];

// Flat list for keyboard navigation, rebuilt on each render
let flatItems = [];
let activeIdx = 0;

// Palette bg colors per theme (approx --bg-alt at 82% opacity over --bg)
// Used to contrast-check theme label colors before applying them
const themePaletteBg = {
  dark:    '#1e1e1e', light:   '#e8e3db',
  ayu:     '#0e1318', dracula: '#1e2030',
};

// Relative luminance from a hex color
function hexLuminance(hex) {
  const r = parseInt(hex.slice(1,3),16)/255;
  const g = parseInt(hex.slice(3,5),16)/255;
  const b = parseInt(hex.slice(5,7),16)/255;
  const lin = c => c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);
  return 0.2126*lin(r) + 0.7152*lin(g) + 0.0722*lin(b);
}

function contrastRatio(hex1, hex2) {
  const l1 = hexLuminance(hex1), l2 = hexLuminance(hex2);
  const lighter = Math.max(l1,l2), darker = Math.min(l1,l2);
  return (lighter + 0.05) / (darker + 0.05);
}

// Returns the theme label color only if it has ≥3:1 contrast on the current
// palette background; otherwise falls back to the current theme's --text color.
function safeThemeLabelColor(themeKey) {
  const labelColor  = themeTextColors[themeKey];
  const bgColor     = themePaletteBg[state.theme] || '#1e1e1e';
  if (contrastRatio(labelColor, bgColor) >= 3) return labelColor;
  // Fall back: use current theme's own text color (always readable on its own bg)
  return themeTextColors[state.theme] || 'var(--text)';
}

let paletteMode = 'commands'; // 'commands' | 'outline'

function render(q) {
  q = (q || '').toLowerCase();
  pList.innerHTML = '';
  flatItems = [];

  if (paletteMode === 'outline') {
    renderOutline(q);
    return;
  }

  commands.forEach(group => {
    const matched = group.items.filter(item =>
      item.label.toLowerCase().includes(q) ||
      group.group.toLowerCase().includes(q)
    );
    if (!matched.length) return;

    if (!q) {
      const sec = document.createElement('div');
      sec.className = 'p-section';
      sec.textContent = group.group;
      pList.appendChild(sec);
    }

    matched.forEach(item => {
      const idx = flatItems.length;
      flatItems.push(item);

      const isActiveTheme = item.themeKey && item.themeKey === state.theme;
      const el = document.createElement('div');
      el.className = 'pitem' + (idx === 0 ? ' active' : '');
      el.dataset.idx = idx;

      // Left: icon + label
      const left = document.createElement('div');
      left.className = 'pitem-left';

      const icon = document.createElement('i');
      icon.className = `ti ${item.icon} pitem-icon`;
      // Active theme icon gets that theme's accent color
      if (isActiveTheme) icon.style.color = themeAccentColors[item.themeKey];

      const label = document.createElement('span');
      label.className = 'pitem-label';
      label.textContent = item.label;
      // Theme items get their own theme's text color, contrast-checked against current palette bg
      if (item.themeKey) label.style.color = safeThemeLabelColor(item.themeKey);

      left.appendChild(icon);
      left.appendChild(label);

      // Right: active-theme checkmark OR kbd badges
      const right = document.createElement('div');
      right.className = 'pitem-kbd';

      if (isActiveTheme) {
        // Checkmark indicator for active theme
        const check = document.createElement('span');
        check.style.cssText = `color:${themeAccentColors[item.themeKey]};font-size:13px;font-weight:700;`;
        check.textContent = '✓';
        right.appendChild(check);
      } else {
        item.keys.forEach(k => {
          const kbd = document.createElement('kbd');
          kbd.className = 'pkey';
          kbd.textContent = k;
          right.appendChild(kbd);
        });
      }

      el.appendChild(left);
      el.appendChild(right);

      el.addEventListener('mousedown', (ev) => { ev.preventDefault(); item.fn(); if (!item.keepOpen) closePalette(); });
      el.addEventListener('mousemove', () => { activeIdx = idx; updateActive(); });
      pList.appendChild(el);
    });
  });

  activeIdx = 0;
  updateActive();
}

// Icons + display labels per outline item type
const outlineTypeMeta = {
  h1:    { icon: 'ti-h-1',          dim: false },
  h2:    { icon: 'ti-h-2',          dim: false },
  h3:    { icon: 'ti-h-3',          dim: true  },
  scene: { icon: 'ti-minus',        dim: true  },
};

function renderOutline(q) {
  const allItems = window.BaretextEditor.getOutline(view);
  const filtered = q
    ? allItems.filter(it => it.text.toLowerCase().includes(q))
    : allItems;

  if (!filtered.length) {
    const empty = document.createElement('div');
    empty.className = 'p-section';
    empty.style.padding = '20px 18px';
    empty.style.opacity = '1';
    empty.textContent = allItems.length
      ? 'No matches'
      : 'No headings or scene breaks yet — use # for chapters, ⌘⇧- for scenes';
    pList.appendChild(empty);
    return;
  }

  const sec = document.createElement('div');
  sec.className = 'p-section';
  sec.textContent = 'Outline';
  pList.appendChild(sec);

  filtered.forEach((item) => {
    const idx = flatItems.length;
    flatItems.push({ fn: () => jumpToOutlineItem(item) });

    const meta = outlineTypeMeta[item.type] || outlineTypeMeta.h3;
    const el = document.createElement('div');
    el.className = 'pitem' + (idx === 0 ? ' active' : '');
    el.dataset.idx = idx;

    const left = document.createElement('div');
    left.className = 'pitem-left';

    const icon = document.createElement('i');
    icon.className = `ti ${meta.icon} pitem-icon`;

    const label = document.createElement('span');
    label.className = 'pitem-label';
    label.textContent = item.text;
    if (meta.dim) label.style.opacity = '0.7';
    // Indent h2/h3 slightly to suggest hierarchy
    if (item.type === 'h2') label.style.paddingLeft = '10px';
    if (item.type === 'h3') label.style.paddingLeft = '20px';

    left.appendChild(icon);
    left.appendChild(label);

    const right = document.createElement('div');
    right.className = 'pitem-kbd';
    const lineNum = document.createElement('span');
    lineNum.style.cssText = 'font-size:11px;color:var(--text-dimmer);font-family:var(--font-mono);';
    lineNum.textContent = 'L' + item.line;
    right.appendChild(lineNum);

    el.appendChild(left);
    el.appendChild(right);

    el.addEventListener('mousedown', (ev) => { ev.preventDefault(); jumpToOutlineItem(item); closePalette(); });
    el.addEventListener('mousemove', () => { activeIdx = idx; updateActive(); });
    pList.appendChild(el);
  });

  activeIdx = 0;
  updateActive();
}

function jumpToOutlineItem(item) {
  window.BaretextEditor.setCursorPos(view, item.pos);
  // Defer focus to the next tick — guarantees this runs after the palette's
  // keydown event has fully finished, so CodeMirror's own Enter binding
  // can't possibly receive the same keypress and insert a newline.
  setTimeout(() => focusEditor(), 0);
}

function openOutline() {
  paletteMode = 'outline';
  pInput.placeholder = 'jump to chapter or scene...';
  overlay.classList.add('open');
  requestAnimationFrame(() => requestAnimationFrame(() => overlay.classList.add('visible')));
  pInput.value = '';
  render('');
  setTimeout(() => pInput.focus(), 10);
}

function updateActive() {
  [...pList.querySelectorAll('.pitem')].forEach(el => {
    const isActive = Number(el.dataset.idx) === activeIdx;
    el.classList.toggle('active', isActive);
    if (isActive) {
      // Scroll active item into view within the palette list
      el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  });
}

let paletteClosing = false;

function openPalette() {
  paletteMode = 'commands';
  pInput.placeholder = 'type a command...';
  if (paletteClosing) paletteClosing = false;
  overlay.classList.add('open');
  requestAnimationFrame(() => requestAnimationFrame(() => overlay.classList.add('visible')));
  pInput.value = '';
  render('');
  setTimeout(() => pInput.focus(), 10);
}

function closePalette(refocus = true) {
  overlay.classList.remove('visible');
  paletteClosing = true;
  setTimeout(() => {
    overlay.classList.remove('open');
    paletteClosing = false;
    paletteMode = 'commands'; // always reset so next ⌘K opens commands, not stale outline
    pInput.placeholder = 'type a command...';
  }, 200);
  if (refocus) setTimeout(() => focusEditor(), 0);
}

pInput.addEventListener('input', () => render(pInput.value));
pInput.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closePalette(); return; }
  if (e.key === 'ArrowDown') { e.preventDefault(); activeIdx = Math.min(activeIdx + 1, flatItems.length - 1); updateActive(); return; }
  if (e.key === 'ArrowUp')   { e.preventDefault(); activeIdx = Math.max(activeIdx - 1, 0); updateActive(); return; }
  if (e.key === 'Enter') {
    e.preventDefault();
    e.stopPropagation();
    const it = flatItems[activeIdx];
    if (it) { it.fn(); if (!it.keepOpen) closePalette(); }
  }
});

function move(dir) {
  activeIdx = Math.max(0, Math.min(activeIdx + dir, flatItems.length - 1));
  updateActive();
}

overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) closePalette(); });

let fontPickerOpenedAt = 0;
function toggleFontPicker() {
  if (fontPicker.classList.contains('open')) {
    fontPicker.classList.remove('open');
  } else {
    fontPickerOpenedAt = Date.now();
    fontPicker.classList.add('open');
  }
}

document.addEventListener('mousedown', (e) => {
  if (!fontPicker.contains(e.target) && Date.now() - fontPickerOpenedAt > 100) {
    fontPicker.classList.remove('open');
  }
});

// Clicking anywhere in the editor area focuses the editor
host.addEventListener('mousedown', (e) => {
  if (e.target === host || e.target.classList.contains('cm-scroller')) {
    focusEditor();
  }
});

// ── Save immediately before any reload/close so ⌘R never loses content ──
window.addEventListener('beforeunload', () => {
  const content = getDoc();
  if (content) window.api.saveNow(content);
});

// ── Init ──
setFont('mono');
focusEditor();
updateCounts('');
</script>

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline'">
  <script>
    // Apply the saved accent theme synchronously, before the <style> block
    // below is parsed, so there's no flash of the default theme on launch.
    (function () {
      var m = /[?&]theme=([a-z]+)/.exec(location.search);
      var valid = ['dark', 'light', 'amstrad', 'grove', 'dracula'];
      if (m && valid.indexOf(m[1]) !== -1) {
        document.documentElement.setAttribute('data-theme', m[1]);
      }
      var mm = /[?&]mode=([a-z]+)/.exec(location.search);
      var validModes = ['sprinter', 'editor'];
      if (mm && validModes.indexOf(mm[1]) !== -1) {
        document.documentElement.setAttribute('data-mode', mm[1]);
      }
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.x/dist/tabler-icons.min.css">
  <title>Baretext</title>
  <style>
    /* ── IBM Plex fonts (local, no network) ── */
    @font-face { font-family: 'IBM Plex Mono'; font-weight: 400; font-style: normal;  src: url('fonts/ibm-plex-mono-400-normal.woff2') format('woff2'); }
    @font-face { font-family: 'IBM Plex Mono'; font-weight: 400; font-style: italic;  src: url('fonts/ibm-plex-mono-400-italic.woff2') format('woff2'); }
    @font-face { font-family: 'IBM Plex Mono'; font-weight: 700; font-style: normal;  src: url('fonts/ibm-plex-mono-700-normal.woff2') format('woff2'); }
    @font-face { font-family: 'IBM Plex Mono'; font-weight: 700; font-style: italic;  src: url('fonts/ibm-plex-mono-700-italic.woff2') format('woff2'); }

    @font-face { font-family: 'IBM Plex Serif'; font-weight: 400; font-style: normal; src: url('fonts/ibm-plex-serif-400-normal.woff2') format('woff2'); }
    @font-face { font-family: 'IBM Plex Serif'; font-weight: 400; font-style: italic; src: url('fonts/ibm-plex-serif-400-italic.woff2') format('woff2'); }
    @font-face { font-family: 'IBM Plex Serif'; font-weight: 700; font-style: normal; src: url('fonts/ibm-plex-serif-700-normal.woff2') format('woff2'); }
    @font-face { font-family: 'IBM Plex Serif'; font-weight: 700; font-style: italic; src: url('fonts/ibm-plex-serif-700-italic.woff2') format('woff2'); }

    @font-face { font-family: 'IBM Plex Sans'; font-weight: 400; font-style: normal;  src: url('fonts/ibm-plex-sans-400-normal.woff2') format('woff2'); }
    @font-face { font-family: 'IBM Plex Sans'; font-weight: 400; font-style: italic;  src: url('fonts/ibm-plex-sans-400-italic.woff2') format('woff2'); }
    @font-face { font-family: 'IBM Plex Sans'; font-weight: 700; font-style: normal;  src: url('fonts/ibm-plex-sans-700-normal.woff2') format('woff2'); }
    @font-face { font-family: 'IBM Plex Sans'; font-weight: 700; font-style: italic;  src: url('fonts/ibm-plex-sans-700-italic.woff2') format('woff2'); }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font-mono: 'IBM Plex Mono', 'SF Mono', 'Menlo', monospace;
      --font-serif: 'IBM Plex Serif', 'Georgia', serif;
      --font-sans: 'IBM Plex Sans', -apple-system, sans-serif;
      /* editor prose font is user-switchable (mono/serif/sans); chrome always uses --font-mono */
      --font-editor: var(--font-mono);

      /* Editor typography/spacing tokens — documented values are ground truth,
         referenced by src/editor/theme.js instead of hardcoding pixel values there. */
      --text-h1: 26px;
      --text-body: 15px;
      --lh-body: 1.9;
      --editor-measure: 75ch; /* line measure — tune this one value to adjust editor line width */
      --rail-w: 250px;

      /* corner radii (per surface) */
      --radius-toast:   5px;
      --radius-picker:  8px;
      --radius-card:    10px;
      --radius-panel:   12px;
      --radius-palette: 14px;
      --radius-kbd:     4px;
      --radius-item:    6px;

      /* elevation — large soft black shadows, no mid-tones */
      --shadow-window:  0 40px 110px rgba(0, 0, 0, .55);
      --shadow-palette: 0 28px 90px rgba(0, 0, 0, .55);
      --shadow-panel:   0 22px 60px rgba(0, 0, 0, .50);
      --shadow-toast:   0 16px 44px rgba(0, 0, 0, .50);

      /* glass blur is color-independent */
      --glass-blur: blur(22px) saturate(160%);

      /* motion */
      --ease-panel: cubic-bezier(0.16, 1, 0.3, 1);
      --dur-panel:  .2s;
      --dur-theme:  .35s;   /* theme wash — deliberately slow */
      --dur-micro:  .1s;
    }

    /* ── Ember (dark, native) ── */
    [data-theme="dark"] {
      --bg: #242424;  --bg-alt: #191919;
      /* --text-dimmer lifted from #5a5040 (ACCESSIBILITY.md: ~2.0:1 against
         --bg-alt, fails WCAG AA) to #968d78 -- clears 4.5:1 against both
         --bg and --bg-alt. Applies everywhere via var(), including
         --placeholder below (was a separate duplicate hex, now derived). */
      --text: #faf2d6; --text-dim: #bdae93; --text-dimmer: #968d78;
      --accent: #f8c537; --border: #3a3a3a;
      --cursor: #f8c537; --sel: rgba(248,197,55,0.22); --placeholder: var(--text-dimmer);
      --syntax-2: #f8c537;
      --typewriter-focus: #fbe6a0;
    }

    /* ── Parchment (light) — warm parchment, never white ── */
    [data-theme="light"] {
      --bg: #f5f0e8;  --bg-alt: #ede8de;
      --text: #2a2218; --text-dim: #6b5f4a; --text-dimmer: #70685b;
      --accent: #b8820a; --border: #d0c8b8;
      --cursor: #b8820a; --sel: rgba(184,130,10,0.20); --placeholder: var(--text-dimmer);
      --syntax-2: #b8820a;
      --typewriter-focus: #1a1206;
    }

    /* ── Amstrad — toned-down Amstrad CPC green-phosphor terminal.
       --text-dim also lifted here (was 4.05:1, still under 4.5:1 on its
       own) so it stays visibly more prominent than the lifted --text-dimmer
       rather than the two colliding. ── */
    [data-theme="amstrad"] {
      --bg: #0d130d;  --bg-alt: #0a0f0a;
      --text: #c8e6b0; --text-dim: #79956c; --text-dimmer: #6f8562;
      --accent: #7dc45a; --border: #1c281a;
      --cursor: #7dc45a; --sel: rgba(125,196,90,0.18); --placeholder: var(--text-dimmer);
      --syntax-2: #7dc45a;
      --typewriter-focus: #b6e85a;
    }

    /* ── Grove — Everforest Dark (Obsidian port), verbatim palette.
       Caret is Everforest blue, not the accent. ── */
    [data-theme="grove"] {
      --bg: #2f383e;  --bg-alt: #272f34;
      --text: #d3c6aa; --text-dim: #9aa79d; --text-dimmer: #9ca293;
      --accent: #a7c080; --border: #525c62;
      --cursor: #7fbbb3; --sel: rgba(82,92,98,0.55); --placeholder: var(--text-dimmer);
      --syntax-2: #e69875;
      --typewriter-focus: #e0c583;
    }

    /* ── Dracula — the standard Dracula palette. Cursor = text, not accent.
       --text-dim also lifted (was 3.36:1) for the same reason as Amstrad. ── */
    [data-theme="dracula"] {
      --bg: #282a36;  --bg-alt: #21222c;
      --text: #f8f8f2; --text-dim: #97a1bf; --text-dimmer: #91929b;
      --accent: #bd93f9; --border: #44475a;
      --cursor: #f8f8f2; --sel: rgba(68,71,90,0.70); --placeholder: var(--text-dimmer);
      --syntax-2: #8be9fd;
      --typewriter-focus: #ffffff;
    }

    /* ── Derived tokens — glass, washes, keycap. MUST be redeclared on every
       themed container (not :root alone) so nested var()s recompose from
       that scope's own colors instead of baking in the dark defaults. ── */
    :root, [data-theme] {
      --glass-bg:           color-mix(in srgb, var(--bg-alt) 86%, transparent);
      --glass-border:       color-mix(in srgb, var(--border) 65%, transparent);
      --glass-highlight:    inset 0 1px 0 color-mix(in srgb, var(--text) 8%, transparent);
      --glass-edge:         color-mix(in srgb, var(--accent) 40%, transparent);
      --wash-accent:        color-mix(in srgb, var(--accent) 9%,  transparent);
      --wash-accent-strong: color-mix(in srgb, var(--accent) 15%, transparent);
      --stripe-accent:      inset 3px 0 0 var(--accent);
      --kbd-bg:             color-mix(in srgb, var(--bg) 55%, transparent);
      --kbd-border:         color-mix(in srgb, var(--border) 80%, transparent);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      /* Smooth theme transitions on root colors */
      transition: background var(--dur-theme) ease, color var(--dur-theme) ease;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: var(--bg);
      /* Theme color transitions ripple through the whole app */
      transition: background var(--dur-theme) ease;
      /* anchor for absolutely-positioned overlays (sprint panel/edge line, etc.) */
      position: relative;
    }

    #titlebar {
      height: 38px;
      flex-shrink: 0;
      -webkit-app-region: drag;
    }

    /* Row wrapper so the scene rail can sit beside the editor — #editor-host
       keeps flex:1 (now sharing horizontal space with the rail instead of
       being the sole vertical flex child of #app), and every existing
       #editor-host .cm-* selector keeps resolving unchanged. */
    #content-row {
      flex: 1;
      display: flex;
      flex-direction: row;
      overflow: hidden;
      position: relative;
    }

    #scene-rail {
      display: none;
      flex-direction: column;
      flex: none;
      width: var(--rail-w);
      background: var(--bg-alt);
      border-right: 1px solid var(--border);
      overflow: hidden;
    }

    /* Full-window scene-card view, replaces #content-row (not a floating
       overlay) — visibility toggled by scene-nav/corkboard.js. */
    #corkboard {
      display: none;
      flex: 1;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    /* Full-window theme gallery, same replaces-#content-row technique as
       #corkboard — visibility toggled by theme-picker.js. */
    #theme-picker {
      display: none;
      flex: 1;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    #editor-host {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    #editor-host .cm-editor { height: 100%; }
    #editor-host .cm-scroller { min-height: 100%; }
    /* editable surface fills the whole height, so the entire area is the writing space */
    #editor-host .cm-content { min-height: 100% !important; }

    /* Native spellcheck styling (Electron/Chromium ::spelling-error) — no
       decoration API needed from the editor bundle for this one. */
    #editor-host .cm-content::spelling-error {
      text-decoration: underline wavy #ff5555;
      text-underline-offset: 3px;
    }

    /* typewriter mode: room so the first AND last lines can still reach the
       center guide (without top padding, line 1 is pinned to the scroll
       top and can never be centered) — opened-up line-height */
    #app.typewriter .cm-content { padding-top: 50vh !important; padding-bottom: 50vh !important; }
    #app.typewriter #editor-host .cm-line { line-height: 2.1; }

    /* Typewriter chrome: center guide, marker, edge fade — hidden unless active */
    #tw-fade, #tw-guide, #tw-marker { display: none; pointer-events: none; }
    #app.typewriter #tw-fade, #app.typewriter #tw-guide, #app.typewriter #tw-marker { display: block; }

    /* Continuous fade centered on the typewriter line (50%) — no flat clear
       zone, starts fading immediately above/below the line itself. All text
       stays the default color; this overlay is what creates the fade, not
       any per-line/per-sentence styling. */
    #tw-fade {
      position: absolute; inset: 0; z-index: 2;
      background: linear-gradient(var(--bg) 0%, transparent 50%, var(--bg) 100%);
    }
    #tw-guide {
      position: absolute; left: 0; right: 0; top: 50%; height: 1px; z-index: 1;
      background: color-mix(in srgb, var(--syntax-2, var(--accent)) 14%, transparent);
    }
    #tw-marker {
      position: absolute; left: 20px; top: calc(50% - 17px); z-index: 1;
      font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
      font-family: var(--font-mono);
      color: color-mix(in srgb, var(--syntax-2, var(--accent)) 40%, transparent);
    }

    /* Typewriter status-bar toggle — always present, click flips typewriter mode.
       all:unset resets browser <button> chrome; re-declares what the shared
       .status-item rule below would otherwise have provided, since #id beats
       .class regardless of source order. */
    #tw-status-indicator {
      all: unset; box-sizing: border-box; cursor: pointer;
      font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.03em; color: var(--text-dim);
      display: flex; align-items: center; gap: 6px; padding: 4px 6px; margin: -4px -6px;
      transition: color 0.15s ease;
    }
    #tw-status-indicator .ti { color: var(--text-dimmer); font-size: 13px; transition: color 0.15s ease; }
    #tw-status-indicator:hover { color: var(--text); }
    #tw-status-indicator:hover .ti { color: var(--text-dim); }
    #tw-status-indicator.tw-on { color: var(--text); }
    #tw-status-indicator.tw-on .ti { color: var(--syntax-2, var(--accent)); }

    #statusbar {
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      flex-shrink: 0;
      border-top: 1px solid var(--border);
      background: var(--bg-alt);
      transition: background var(--dur-theme) ease, border-color var(--dur-theme) ease,
                  opacity 0.25s ease, transform 0.25s ease;
    }
    /* Focus mode: slide the statusbar down out of view */
    #statusbar.hidden {
      opacity: 0;
      transform: translateY(4px);
      pointer-events: none;
    }
    .status-group { display: flex; align-items: center; gap: 14px; }
    .status-item {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-dim);
      letter-spacing: 0.03em;
      transition: color var(--dur-theme) ease;
    }
    .status-item.dimmer { color: var(--text-dimmer); }

    #save-error {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #e05c5c;
      display: none;
      flex-shrink: 0;
    }
    #save-error.visible { display: block; }

    /* ===== Command palette ===== */
    #overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0);
      z-index: 9999;
      transition: background 0.22s ease;
    }
    #overlay.open  { display: block; }
    #overlay.visible { background: rgba(0,0,0,0.35); }
    [data-theme="light"] #overlay.visible { background: rgba(0,0,0,0.18); }

    /* Glass palette panel — uses theme vars for full theme expression */
    #palette {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(-14px);
      width: 580px;
      max-width: 93vw;
      /* Glass effect: theme bg at ~78% opacity, blur samples content behind */
      background: color-mix(in srgb, var(--bg-alt) 82%, transparent);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      border: 1px solid color-mix(in srgb, var(--border) 60%, transparent);
      border-radius: 14px;
      overflow: hidden;
      box-shadow:
        0 2px 0 0 color-mix(in srgb, var(--accent) 15%, transparent),
        0 28px 90px rgba(0,0,0,0.55),
        inset 0 1px 0 color-mix(in srgb, var(--text) 8%, transparent);
      opacity: 0;
      transition: opacity 0.16s ease, transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #overlay.visible #palette {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Search row */
    #palette-search-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 15px 18px;
      border-bottom: 1px solid color-mix(in srgb, var(--border) 50%, transparent);
    }
    #palette-search-icon {
      font-size: 16px;
      color: var(--text-dim);
      flex-shrink: 0;
      transition: color 0.2s;
    }
    #palette-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      caret-color: var(--cursor);
      font-family: var(--font-mono);
      font-size: 14px;
      padding: 0;
    }
    #palette-input::placeholder { color: var(--text-dimmer); }

    /* Scrollable list */
    #palette-list {
      max-height: 480px;
      overflow-y: auto;
      padding: 6px 0;
    }
    #palette-list::-webkit-scrollbar { width: 3px; }
    #palette-list::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--accent) 30%, transparent);
      border-radius: 2px;
    }

    /* Section labels — accent colored for theme expression */
    .p-section {
      padding: 10px 18px 4px;
      font-size: 10px;
      font-family: var(--font-mono);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      opacity: 0.7;
    }

    /* Items — box-shadow accent stripe, NO border-left (prevents text shift) */
    .pitem {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 18px;
      cursor: pointer;
      gap: 10px;
      transition: background 0.08s ease, box-shadow 0.08s ease;
      box-shadow: inset 3px 0 0 transparent;
    }
    .pitem:hover {
      background: color-mix(in srgb, var(--accent) 8%, transparent);
    }
    .pitem.active {
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .pitem-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }
    .pitem-icon {
      font-size: 15px;
      color: var(--text-dim);
      flex-shrink: 0;
      width: 18px;
      text-align: center;
      transition: color 0.15s;
    }
    .pitem.active .pitem-icon,
    .pitem:hover   .pitem-icon { color: var(--accent); }

    /* Default item label color — theme's text color */
    .pitem-label {
      font-size: 13px;
      font-family: var(--font-mono);
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      /* NO transform or position changes on active — text stays put */
    }

    /* kbd badges — use theme border/text colors */
    .pitem-kbd {
      display: flex;
      gap: 3px;
      flex-shrink: 0;
    }
    kbd.pkey {
      font-size: 11px;
      font-family: var(--font-mono);
      padding: 2px 6px;
      background: color-mix(in srgb, var(--bg) 60%, transparent);
      border: 1px solid color-mix(in srgb, var(--border) 80%, transparent);
      border-bottom-width: 2px;
      border-radius: 4px;
      color: var(--text-dim);
      line-height: 1.4;
    }

    /* Footer hints */
    #palette-footer {
      display: flex;
      gap: 16px;
      padding: 9px 18px;
      border-top: 1px solid color-mix(in srgb, var(--border) 40%, transparent);
    }
    .p-hint {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-dimmer);
    }
    kbd.phkey {
      font-size: 10px;
      font-family: var(--font-mono);
      padding: 1px 5px;
      background: color-mix(in srgb, var(--bg) 50%, transparent);
      border: 1px solid color-mix(in srgb, var(--border) 60%, transparent);
      border-bottom-width: 2px;
      border-radius: 3px;
      color: var(--text-dim);
    }

    /* ===== Font picker ===== */
    #font-picker {
      display: flex;
      position: fixed;
      bottom: 44px;
      left: 50%;
      transform: translateX(-50%) translateY(6px);
      background: color-mix(in srgb, var(--bg-alt) 88%, transparent);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
      border-radius: 8px;
      padding: 5px;
      gap: 2px;
      z-index: 50;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.16s ease, transform 0.16s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #font-picker.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }
    .fbtn {
      padding: 6px 16px;
      font-size: 12px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.12s ease, color 0.12s ease, transform 0.1s ease;
    }
    .fbtn:hover { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--text); transform: scale(1.04); }
    .fbtn:active { transform: scale(0.97); }
    .fbtn.active { background: var(--accent); color: var(--bg); font-weight: 600; }
    .fbtn.mono  { font-family: var(--font-mono); }
    .fbtn.serif { font-family: var(--font-serif); }
    .fbtn.sans  { font-family: var(--font-sans); }

    /* ===== Toast ===== */
    #toast {
      position: fixed;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%) translateY(8px) scale(0.96);
      background: color-mix(in srgb, var(--bg-alt) 90%, transparent);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid color-mix(in srgb, var(--border) 60%, transparent);
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 5px 14px;
      border-radius: 5px;
      opacity: 0;
      transition: opacity 0.16s ease, transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      z-index: 200;
      white-space: nowrap;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0) scale(1);
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--text-dimmer); border-radius: 2px; }

    /* Global keyboard-focus ring. :focus-visible (not :focus) so a mouse
       click doesn't show it, only keyboard/programmatic focus -- covers
       every interactive pattern in the app, including the JS-injected
       feature stylesheets (rail/corkboard/sprint-timer/theme-picker), since
       this is a single app-wide rule rather than one per component. */
    :where(button, a, input, textarea, select,
           [role="option"], [role="treeitem"], [role="radio"], [role="tab"], [tabindex]):focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 4px;
    }

    /* Respect the OS-level "reduce motion" preference: collapse every
       animation/transition to effectively instant, and stop the sprint
       panel's infinite pulsing dot entirely -- continuous motion is a
       vestibular/attention trigger some users have this setting on for. */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>

<div id="app">
  <div id="titlebar"></div>
  <div id="content-row">
    <div id="scene-rail"></div>
    <div id="editor-host">
      <div id="tw-fade"></div>
      <div id="tw-guide"></div>
      <div id="tw-marker">typewriter</div>
    </div>
  </div>
  <div id="corkboard"></div>
  <div id="theme-picker"></div>
  <div id="statusbar" role="region" aria-label="Status">
    <div class="status-group">
      <span class="status-item" id="word-count">0 words</span>
      <span class="status-item dimmer" id="char-count">0 chars</span>
      <span class="status-item dimmer" id="md-mode">preview</span>
      <button type="button" class="status-item" id="tw-status-indicator" aria-pressed="false" aria-label="Toggle typewriter mode"><i class="ti ti-align-left" aria-hidden="true"></i>typewriter</button>
    </div>
    <div class="status-group">
      <div id="save-error" title="save failed"></div>
      <span class="status-item dimmer" id="file-name">untitled</span>
    </div>
  </div>
</div>

<div id="overlay">
  <div id="palette" role="dialog" aria-modal="true" aria-label="Command palette">
    <div id="palette-search-row">
      <i class="ti ti-search" id="palette-search-icon" aria-hidden="true"></i>
      <input id="palette-input" type="text" placeholder="type a command..." autocomplete="off" spellcheck="false"
             role="combobox" aria-expanded="true" aria-controls="palette-list" aria-autocomplete="list" aria-activedescendant="">
    </div>
    <div id="palette-list" role="listbox" aria-label="Commands"></div>
    <div id="palette-footer">
      <span class="p-hint"><kbd class="phkey">↑↓</kbd> navigate</span>
      <span class="p-hint"><kbd class="phkey">↵</kbd> select</span>
      <span class="p-hint"><kbd class="phkey">esc</kbd> close</span>
    </div>
  </div>
</div>

<div id="font-picker" role="radiogroup" aria-label="Editor font">
  <button class="fbtn mono active" data-font="mono" role="radio" aria-checked="true">mono</button>
  <button class="fbtn serif" data-font="serif" role="radio" aria-checked="false">serif</button>
  <button class="fbtn sans" data-font="sans" role="radio" aria-checked="false">sans</button>
</div>

<div id="toast"></div>

<!-- CodeMirror bundle (local, no network) -->
<script src="editor-bundle.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>

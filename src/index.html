<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline'">
  <script>
    // Apply the saved accent theme synchronously, before the <style> block
    // below is parsed, so there's no flash of the default theme on launch.
    (function () {
      var m = /[?&]theme=([a-z]+)/.exec(location.search);
      var valid = ['dark', 'light', 'ayu', 'dracula'];
      if (m && valid.indexOf(m[1]) !== -1) {
        document.documentElement.setAttribute('data-theme', m[1]);
      }
      var mm = /[?&]mode=([a-z]+)/.exec(location.search);
      var validModes = ['sprinter', 'editor'];
      if (mm && validModes.indexOf(mm[1]) !== -1) {
        document.documentElement.setAttribute('data-mode', mm[1]);
      }
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.x/dist/tabler-icons.min.css">
  <title>Baretext</title>
  <style>
    /* ── IBM Plex fonts (local, no network) ── */
    @font-face { font-family: 'IBM Plex Mono'; font-weight: 400; font-style: normal;  src: url('fonts/ibm-plex-mono-400-normal.woff2') format('woff2'); }
    @font-face { font-family: 'IBM Plex Mono'; font-weight: 400; font-style: italic;  src: url('fonts/ibm-plex-mono-400-italic.woff2') format('woff2'); }
    @font-face { font-family: 'IBM Plex Mono'; font-weight: 700; font-style: normal;  src: url('fonts/ibm-plex-mono-700-normal.woff2') format('woff2'); }
    @font-face { font-family: 'IBM Plex Mono'; font-weight: 700; font-style: italic;  src: url('fonts/ibm-plex-mono-700-italic.woff2') format('woff2'); }

    @font-face { font-family: 'IBM Plex Serif'; font-weight: 400; font-style: normal; src: url('fonts/ibm-plex-serif-400-normal.woff2') format('woff2'); }
    @font-face { font-family: 'IBM Plex Serif'; font-weight: 400; font-style: italic; src: url('fonts/ibm-plex-serif-400-italic.woff2') format('woff2'); }
    @font-face { font-family: 'IBM Plex Serif'; font-weight: 700; font-style: normal; src: url('fonts/ibm-plex-serif-700-normal.woff2') format('woff2'); }
    @font-face { font-family: 'IBM Plex Serif'; font-weight: 700; font-style: italic; src: url('fonts/ibm-plex-serif-700-italic.woff2') format('woff2'); }

    @font-face { font-family: 'IBM Plex Sans'; font-weight: 400; font-style: normal;  src: url('fonts/ibm-plex-sans-400-normal.woff2') format('woff2'); }
    @font-face { font-family: 'IBM Plex Sans'; font-weight: 400; font-style: italic;  src: url('fonts/ibm-plex-sans-400-italic.woff2') format('woff2'); }
    @font-face { font-family: 'IBM Plex Sans'; font-weight: 700; font-style: normal;  src: url('fonts/ibm-plex-sans-700-normal.woff2') format('woff2'); }
    @font-face { font-family: 'IBM Plex Sans'; font-weight: 700; font-style: italic;  src: url('fonts/ibm-plex-sans-700-italic.woff2') format('woff2'); }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font-mono: 'IBM Plex Mono', 'SF Mono', 'Menlo', monospace;
      --font-serif: 'IBM Plex Serif', 'Georgia', serif;
      --font-sans: 'IBM Plex Sans', -apple-system, sans-serif;
      /* editor prose font is user-switchable (mono/serif/sans); chrome always uses --font-mono */
      --font-editor: var(--font-mono);

      /* Editor typography/spacing tokens — documented values are ground truth,
         referenced by src/editor/theme.js instead of hardcoding pixel values there. */
      --text-h1: 26px;
      --text-body: 15px;
      --lh-body: 1.9;
      --editor-measure: 620px;
      --rail-w: 250px;
    }

    /* ── DARK (original baretext dark) ── */
    [data-theme="dark"] {
      --bg: #242424;  --bg-alt: #191919;
      --text: #faf2d6; --text-dim: #bdae93; --text-dimmer: #5a5040;
      --accent: #f8c537; --border: #3a3a3a;
      --cursor: #f8c537; --sel: rgba(248,197,55,0.22); --placeholder: #5a5040;
      --syntax-2: #f8c537;
    }

    /* ── LIGHT (warm parchment) ── */
    [data-theme="light"] {
      --bg: #f5f0e8;  --bg-alt: #ede8de;
      --text: #2a2218; --text-dim: #6b5f4a; --text-dimmer: #b0a898;
      --accent: #b8820a; --border: #d0c8b8;
      --cursor: #b8820a; --sel: rgba(184,130,10,0.20); --placeholder: #b0a898;
      --syntax-2: #b8820a;
    }

    /* ── AYU — green terminal (ayu-theme) ── */
    [data-theme="ayu"] {
      --bg: #0d130d;  --bg-alt: #0a0f0a;
      --text: #c8e6b0; --text-dim: #5f7a55; --text-dimmer: #2d3d29;
      --accent: #7dc45a; --border: #1c281a;
      --cursor: #7dc45a; --sel: rgba(125,196,90,0.18); --placeholder: #2d3d29;
      --syntax-2: #7dc45a;
    }

    /* ── DRACULA — purple midnight, vivid neons (draculatheme.com) ── */
    [data-theme="dracula"] {
      --bg: #282a36;  --bg-alt: #21222c;
      --text: #f8f8f2; --text-dim: #6272a4; --text-dimmer: #44475a;
      --accent: #bd93f9; --border: #44475a;
      --cursor: #f8f8f2; --sel: rgba(68,71,90,0.70); --placeholder: #44475a;
      --syntax-2: #8be9fd;
    }

    /* ── Derived tokens — glass, washes, keycap. MUST be redeclared on every
       themed container (not :root alone) so nested var()s recompose from
       that scope's own colors instead of baking in the dark defaults. ── */
    :root, [data-theme] {
      --radius-panel: 12px;
      --shadow-panel: 0 22px 60px rgba(0,0,0,.50);
      --shadow-toast: 0 16px 44px rgba(0,0,0,.50);
      --glass-bg:           color-mix(in srgb, var(--bg-alt) 86%, transparent);
      --glass-border:       color-mix(in srgb, var(--border) 65%, transparent);
      --glass-highlight:    inset 0 1px 0 color-mix(in srgb, var(--text) 8%, transparent);
      --glass-edge:         color-mix(in srgb, var(--accent) 40%, transparent);
      --wash-accent:        color-mix(in srgb, var(--accent) 9%,  transparent);
      --wash-accent-strong: color-mix(in srgb, var(--accent) 15%, transparent);
      --stripe-accent:      inset 3px 0 0 var(--accent);
      --kbd-bg:             color-mix(in srgb, var(--bg) 55%, transparent);
      --kbd-border:         color-mix(in srgb, var(--border) 80%, transparent);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      /* Smooth theme transitions on root colors */
      transition: background 0.35s ease, color 0.35s ease;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: var(--bg);
      /* Theme color transitions ripple through the whole app */
      transition: background 0.35s ease;
      /* anchor for absolutely-positioned overlays (sprint panel/edge line, etc.) */
      position: relative;
    }

    #titlebar {
      height: 38px;
      flex-shrink: 0;
      -webkit-app-region: drag;
    }

    /* Row wrapper so the scene rail can sit beside the editor — #editor-host
       keeps flex:1 (now sharing horizontal space with the rail instead of
       being the sole vertical flex child of #app), and every existing
       #editor-host .cm-* selector keeps resolving unchanged. */
    #content-row {
      flex: 1;
      display: flex;
      flex-direction: row;
      overflow: hidden;
      position: relative;
    }

    #scene-rail {
      display: none;
      flex-direction: column;
      flex: none;
      width: var(--rail-w);
      background: var(--bg-alt);
      border-right: 1px solid var(--border);
      overflow: hidden;
    }

    /* Full-window scene-card view, replaces #content-row (not a floating
       overlay) — visibility toggled by scene-nav/corkboard.js. */
    #corkboard {
      display: none;
      flex: 1;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    #editor-host {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    #editor-host .cm-editor { height: 100%; }
    #editor-host .cm-scroller { min-height: 100%; }
    /* editable surface fills the whole height, so the entire area is the writing space */
    #editor-host .cm-content { min-height: 100% !important; }

    /* Native spellcheck styling (Electron/Chromium ::spelling-error) — no
       decoration API needed from the editor bundle for this one. */
    #editor-host .cm-content::spelling-error {
      text-decoration: underline wavy #ff5555;
      text-underline-offset: 3px;
    }

    /* typewriter mode: room so last lines can center, opened-up line-height */
    #app.typewriter .cm-content { padding-bottom: 50vh !important; }
    #app.typewriter #editor-host .cm-line { line-height: 2.1; }

    /* Typewriter chrome: center guide, marker, edge fade — hidden unless active */
    #tw-fade, #tw-guide, #tw-marker { display: none; pointer-events: none; }
    #app.typewriter #tw-fade, #app.typewriter #tw-guide, #app.typewriter #tw-marker { display: block; }

    /* Continuous fade centered on the typewriter line (50%) — no flat clear
       zone, starts fading immediately above/below the line itself. All text
       stays the default color; this overlay is what creates the fade, not
       any per-line/per-sentence styling. */
    #tw-fade {
      position: absolute; inset: 0; z-index: 2;
      background: linear-gradient(var(--bg) 0%, transparent 50%, var(--bg) 100%);
    }
    #tw-guide {
      position: absolute; left: 0; right: 0; top: 50%; height: 1px; z-index: 1;
      background: color-mix(in srgb, var(--syntax-2, var(--accent)) 14%, transparent);
    }
    #tw-marker {
      position: absolute; left: 20px; top: calc(50% - 17px); z-index: 1;
      font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
      font-family: var(--font-mono);
      color: color-mix(in srgb, var(--syntax-2, var(--accent)) 40%, transparent);
    }

    /* Typewriter status-bar indicator — hidden unless active */
    #tw-status-indicator { display: none; align-items: center; gap: 6px; }
    #app.typewriter #tw-status-indicator { display: flex; }
    #tw-status-indicator .ti { color: var(--syntax-2, var(--accent)); font-size: 13px; }

    #statusbar {
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      flex-shrink: 0;
      border-top: 1px solid var(--border);
      background: var(--bg-alt);
      transition: background 0.35s ease, border-color 0.35s ease,
                  opacity 0.25s ease, transform 0.25s ease;
    }
    /* Focus mode: slide the statusbar down out of view */
    #statusbar.hidden {
      opacity: 0;
      transform: translateY(4px);
      pointer-events: none;
    }
    .status-group { display: flex; align-items: center; gap: 14px; }
    .status-item {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-dim);
      letter-spacing: 0.03em;
      transition: color 0.35s ease;
    }
    .status-item.dimmer { color: var(--text-dimmer); }

    #save-error {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #e05c5c;
      display: none;
      flex-shrink: 0;
    }
    #save-error.visible { display: block; }

    /* ===== Command palette ===== */
    #overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0);
      z-index: 9999;
      transition: background 0.22s ease;
    }
    #overlay.open  { display: block; }
    #overlay.visible { background: rgba(0,0,0,0.35); }
    [data-theme="light"] #overlay.visible { background: rgba(0,0,0,0.18); }

    /* Glass palette panel — uses theme vars for full theme expression */
    #palette {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(-14px);
      width: 580px;
      max-width: 93vw;
      /* Glass effect: theme bg at ~78% opacity, blur samples content behind */
      background: color-mix(in srgb, var(--bg-alt) 82%, transparent);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      border: 1px solid color-mix(in srgb, var(--border) 60%, transparent);
      border-radius: 14px;
      overflow: hidden;
      box-shadow:
        0 2px 0 0 color-mix(in srgb, var(--accent) 15%, transparent),
        0 28px 90px rgba(0,0,0,0.55),
        inset 0 1px 0 color-mix(in srgb, var(--text) 8%, transparent);
      opacity: 0;
      transition: opacity 0.16s ease, transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #overlay.visible #palette {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Search row */
    #palette-search-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 15px 18px;
      border-bottom: 1px solid color-mix(in srgb, var(--border) 50%, transparent);
    }
    #palette-search-icon {
      font-size: 16px;
      color: var(--text-dim);
      flex-shrink: 0;
      transition: color 0.2s;
    }
    #palette-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      caret-color: var(--cursor);
      font-family: var(--font-mono);
      font-size: 14px;
      padding: 0;
    }
    #palette-input::placeholder { color: var(--text-dimmer); }

    /* Scrollable list */
    #palette-list {
      max-height: 480px;
      overflow-y: auto;
      padding: 6px 0;
    }
    #palette-list::-webkit-scrollbar { width: 3px; }
    #palette-list::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--accent) 30%, transparent);
      border-radius: 2px;
    }

    /* Section labels — accent colored for theme expression */
    .p-section {
      padding: 10px 18px 4px;
      font-size: 10px;
      font-family: var(--font-mono);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      opacity: 0.7;
    }

    /* Items — box-shadow accent stripe, NO border-left (prevents text shift) */
    .pitem {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 18px;
      cursor: pointer;
      gap: 10px;
      transition: background 0.08s ease, box-shadow 0.08s ease;
      box-shadow: inset 3px 0 0 transparent;
    }
    .pitem:hover {
      background: color-mix(in srgb, var(--accent) 8%, transparent);
    }
    .pitem.active {
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .pitem-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }
    .pitem-icon {
      font-size: 15px;
      color: var(--text-dim);
      flex-shrink: 0;
      width: 18px;
      text-align: center;
      transition: color 0.15s;
    }
    .pitem.active .pitem-icon,
    .pitem:hover   .pitem-icon { color: var(--accent); }

    /* Default item label color — theme's text color */
    .pitem-label {
      font-size: 13px;
      font-family: var(--font-mono);
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      /* NO transform or position changes on active — text stays put */
    }

    /* kbd badges — use theme border/text colors */
    .pitem-kbd {
      display: flex;
      gap: 3px;
      flex-shrink: 0;
    }
    kbd.pkey {
      font-size: 11px;
      font-family: var(--font-mono);
      padding: 2px 6px;
      background: color-mix(in srgb, var(--bg) 60%, transparent);
      border: 1px solid color-mix(in srgb, var(--border) 80%, transparent);
      border-bottom-width: 2px;
      border-radius: 4px;
      color: var(--text-dim);
      line-height: 1.4;
    }

    /* Footer hints */
    #palette-footer {
      display: flex;
      gap: 16px;
      padding: 9px 18px;
      border-top: 1px solid color-mix(in srgb, var(--border) 40%, transparent);
    }
    .p-hint {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-dimmer);
    }
    kbd.phkey {
      font-size: 10px;
      font-family: var(--font-mono);
      padding: 1px 5px;
      background: color-mix(in srgb, var(--bg) 50%, transparent);
      border: 1px solid color-mix(in srgb, var(--border) 60%, transparent);
      border-bottom-width: 2px;
      border-radius: 3px;
      color: var(--text-dim);
    }

    /* ===== Font picker ===== */
    #font-picker {
      display: flex;
      position: fixed;
      bottom: 44px;
      left: 50%;
      transform: translateX(-50%) translateY(6px);
      background: color-mix(in srgb, var(--bg-alt) 88%, transparent);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
      border-radius: 8px;
      padding: 5px;
      gap: 2px;
      z-index: 50;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.16s ease, transform 0.16s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #font-picker.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }
    .fbtn {
      padding: 6px 16px;
      font-size: 12px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.12s ease, color 0.12s ease, transform 0.1s ease;
    }
    .fbtn:hover { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--text); transform: scale(1.04); }
    .fbtn:active { transform: scale(0.97); }
    .fbtn.active { background: var(--accent); color: var(--bg); font-weight: 600; }
    .fbtn.mono  { font-family: var(--font-mono); }
    .fbtn.serif { font-family: var(--font-serif); }
    .fbtn.sans  { font-family: var(--font-sans); }

    /* ===== Toast ===== */
    #toast {
      position: fixed;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%) translateY(8px) scale(0.96);
      background: color-mix(in srgb, var(--bg-alt) 90%, transparent);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid color-mix(in srgb, var(--border) 60%, transparent);
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 5px 14px;
      border-radius: 5px;
      opacity: 0;
      transition: opacity 0.16s ease, transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      z-index: 200;
      white-space: nowrap;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0) scale(1);
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--text-dimmer); border-radius: 2px; }
  </style>
</head>
<body>

<div id="app">
  <div id="titlebar"></div>
  <div id="content-row">
    <div id="scene-rail"></div>
    <div id="editor-host">
      <div id="tw-fade"></div>
      <div id="tw-guide"></div>
      <div id="tw-marker">typewriter</div>
    </div>
  </div>
  <div id="corkboard"></div>
  <div id="statusbar">
    <div class="status-group">
      <span class="status-item" id="word-count">0 words</span>
      <span class="status-item dimmer" id="char-count">0 chars</span>
      <span class="status-item dimmer" id="md-mode">preview</span>
      <span class="status-item" id="tw-status-indicator"><i class="ti ti-align-left"></i>typewriter</span>
    </div>
    <div class="status-group">
      <div id="save-error" title="save failed"></div>
      <span class="status-item dimmer" id="file-name">untitled</span>
    </div>
  </div>
</div>

<div id="overlay">
  <div id="palette">
    <div id="palette-search-row">
      <i class="ti ti-search" id="palette-search-icon" aria-hidden="true"></i>
      <input id="palette-input" type="text" placeholder="type a command..." autocomplete="off" spellcheck="false">
    </div>
    <div id="palette-list"></div>
    <div id="palette-footer">
      <span class="p-hint"><kbd class="phkey">↑↓</kbd> navigate</span>
      <span class="p-hint"><kbd class="phkey">↵</kbd> select</span>
      <span class="p-hint"><kbd class="phkey">esc</kbd> close</span>
    </div>
  </div>
</div>

<div id="font-picker">
  <button class="fbtn mono active" data-font="mono">mono</button>
  <button class="fbtn serif" data-font="serif">serif</button>
  <button class="fbtn sans" data-font="sans">sans</button>
</div>

<div id="toast"></div>

<!-- CodeMirror bundle (local, no network) -->
<script src="editor-bundle.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>

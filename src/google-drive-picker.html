<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #242424; color: #d8d3c7; font: 13px -apple-system, sans-serif; }
  main { display: flex; flex-direction: column; height: 100%; padding: 24px; box-sizing: border-box; }
  h1 { margin: 0 0 8px; font-size: 17px; font-weight: 600; }
  p { margin: 0 0 18px; color: #aaa69b; line-height: 1.45; }
  #folders { display: flex; flex: 1; flex-direction: column; gap: 7px; overflow: auto; }
  button { border: 1px solid #55534e; border-radius: 6px; padding: 10px 12px; background: #2d2d2a; color: #d8d3c7; text-align: left; font: inherit; cursor: pointer; }
  button:hover, button:focus-visible { border-color: #b8d878; background: #363832; outline: none; }
  #footer { display: flex; justify-content: flex-end; margin-top: 18px; }
  #cancel { text-align: center; color: #aaa69b; }
  #empty { color: #aaa69b; padding: 12px 0; }
</style>
</head>
<body>
<main>
  <h1>Choose a backup folder</h1>
  <p>Select a folder Baretext can access in Google Drive.</p>
  <div id="folders"><div id="empty">Loading folders…</div></div>
  <div id="footer"><button id="cancel" type="button">cancel</button></div>
</main>
<script>
  const folderList = document.getElementById('folders');
  function render(config) {
    folderList.textContent = '';
    const folders = (config && config.folders) || [];
    if (!folders.length) {
      const empty = document.createElement('div');
      empty.id = 'empty';
      empty.textContent = 'No Drive folders are available to Baretext yet. Use the default Baretext Backups folder.';
      folderList.appendChild(empty);
      return;
    }
    folders.forEach(folder => {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = folder.name;
      button.addEventListener('click', () => window.pickerBridge.folderChosen(folder));
      folderList.appendChild(button);
    });
  }
  document.getElementById('cancel').addEventListener('click', () => window.pickerBridge.cancelled());
  window.addEventListener('keydown', event => { if (event.key === 'Escape') window.pickerBridge.cancelled(); });
  window.pickerBridge.getConfig().then(render);
</script>
</body>
</html>

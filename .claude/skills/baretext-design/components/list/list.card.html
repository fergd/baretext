<!-- @dsCard group="Components" viewport="700x230" name="Manuscript rows" subtitle="ChapterHeader + SceneRow" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0}body{background:var(--surface-canvas);font-family:var(--font-mono);padding:20px}
.panel{background:var(--surface-panel);border:1px solid var(--border-subtle);border-radius:var(--radius-panel);padding:8px;max-width:400px;position:relative}</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
</head><body><div id="root"></div>
<script type="text/babel">
const NS = window.Baretext || window.BaretextDesignSystem || window.DS || {};
const { ChapterHeader, SceneRow, Connector, TextButton } = NS;
function Demo(){
  const [sel,setSel] = React.useState('a');
  return (<div className="panel">
    <ChapterHeader number={1} title="Warfare Winter" meta="6/4557" open />
    <div style={{position:'relative'}}>
      <Connector active top={2} bottom={40} left={20} />
      <SceneRow title="Scene 1" count={773} selected={sel==='a'} onSelect={()=>setSel('a')} />
      <SceneRow title="January black ice" count={269} selected={sel==='b'} onSelect={()=>setSel('b')} />
      <SceneRow title="Scene 1" status="draft" selected={sel==='c'} onSelect={()=>setSel('c')} />
      <TextButton icon="plus" style={{marginLeft:56}}>add scene</TextButton>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>

<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--surface-canvas);color:var(--text-title);font-family:var(--font-mono);padding:20px}
  .row{display:flex;align-items:center;gap:12px}
  .wrap{display:flex;flex-wrap:wrap;gap:12px}
  .lbl{font-size:11px;color:var(--text-meta);letter-spacing:.04em}
  .mono{font-variant-numeric:tabular-nums}
</style></head><body><div class="wrap" style="gap:18px">
<div style="display:flex;flex-direction:column;gap:6px;align-items:center">
  <div style="width:72px;height:52px;background:var(--surface-raised);border:1px solid var(--border-strong);border-radius:var(--radius-xs)"></div>
  <div class="lbl mono">4</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center">
  <div style="width:72px;height:52px;background:var(--surface-raised);border:1px solid var(--border-strong);border-radius:var(--radius-sm)"></div>
  <div class="lbl mono">8</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center">
  <div style="width:72px;height:52px;background:var(--surface-raised);border:1px solid var(--border-strong);border-radius:var(--radius-md)"></div>
  <div class="lbl mono">12 · row</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center">
  <div style="width:72px;height:52px;background:var(--surface-raised);border:1px solid var(--border-strong);border-radius:var(--radius-lg)"></div>
  <div class="lbl mono">16</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center">
  <div style="width:72px;height:52px;background:var(--surface-raised);border:1px solid var(--border-strong);border-radius:var(--radius-xl)"></div>
  <div class="lbl mono">20 · panel</div></div>
<div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:52px;height:52px;background:var(--surface-raised);border:1px solid var(--border-strong);border-radius:50%"></div><div class="lbl mono">round · btn</div></div>
</div></body></html>

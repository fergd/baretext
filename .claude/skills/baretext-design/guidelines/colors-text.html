<!-- @dsCard group="Colors" viewport="700x140" name="Text" subtitle="Foreground ramp, strong to faint" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--surface-canvas);color:var(--text-title);font-family:var(--font-mono);padding:20px}
  .row{display:flex;align-items:center;gap:12px}
  .wrap{display:flex;flex-wrap:wrap;gap:12px}
  .lbl{font-size:11px;color:var(--text-meta);letter-spacing:.04em}
  .mono{font-variant-numeric:tabular-nums}
</style></head><body><div class="wrap" style="gap:28px">
<div style="display:flex;flex-direction:column;gap:4px">
  <div style="font-size:22px;color:var(--text-strong)">Ag</div>
  <div class="lbl">strong</div><div class="lbl mono" style="color:var(--text-faint)">#eef1ef</div></div>
<div style="display:flex;flex-direction:column;gap:4px">
  <div style="font-size:22px;color:var(--text-title)">Ag</div>
  <div class="lbl">title</div><div class="lbl mono" style="color:var(--text-faint)">#d6dbd8</div></div>
<div style="display:flex;flex-direction:column;gap:4px">
  <div style="font-size:22px;color:var(--text-muted)">Ag</div>
  <div class="lbl">muted</div><div class="lbl mono" style="color:var(--text-faint)">#9aa2a1</div></div>
<div style="display:flex;flex-direction:column;gap:4px">
  <div style="font-size:22px;color:var(--text-meta)">Ag</div>
  <div class="lbl">meta</div><div class="lbl mono" style="color:var(--text-faint)">#828b83</div></div>
<div style="display:flex;flex-direction:column;gap:4px">
  <div style="font-size:22px;color:var(--text-faint)">Ag</div>
  <div class="lbl">faint</div><div class="lbl mono" style="color:var(--text-faint)">#5c635f</div></div>
</div></body></html>

<!-- @dsCard group="Motion" viewport="700x160" name="Duration & easing" subtitle="ease-standard drives almost everything" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--surface-canvas);color:var(--text-title);font-family:var(--font-mono);padding:20px}
  .row{display:flex;align-items:center;gap:12px}
  .wrap{display:flex;flex-wrap:wrap;gap:12px}
  .lbl{font-size:11px;color:var(--text-meta);letter-spacing:.04em}
  .mono{font-variant-numeric:tabular-nums}
</style></head><body><div style="display:flex;flex-direction:column;gap:10px">
<div class="row"><span class="mono lbl" style="width:80px">120ms</span><span class="lbl">hover / press state layers</span></div>
<div class="row"><span class="mono lbl" style="width:80px">180ms</span><span class="lbl">chevron rotate</span></div>
<div class="row"><span class="mono lbl" style="width:80px">220ms</span><span class="lbl">count &harr; controls swap</span></div>
<div class="row"><span class="mono lbl" style="width:80px">320ms</span><span class="lbl">disclosure expand</span></div>
<div class="row" style="margin-top:6px"><span class="lbl mono" style="color:var(--text-faint)">ease-standard cubic-bezier(.4, 0, .2, 1)</span></div>
</div></body></html>

<!-- @dsCard group="Type" viewport="700x260" name="Roles" subtitle="JetBrains Mono — overline, title, body, meta" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--surface-canvas);color:var(--text-title);font-family:var(--font-mono);padding:20px}
  .row{display:flex;align-items:center;gap:12px}
  .wrap{display:flex;flex-wrap:wrap;gap:12px}
  .lbl{font-size:11px;color:var(--text-meta);letter-spacing:.04em}
  .mono{font-variant-numeric:tabular-nums}
</style></head><body><div style="max-width:640px">
<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--border-subtle);padding:10px 0">
  <span style="font:var(--type-overline);letter-spacing:var(--tracking-overline);color:var(--text-muted)">MANUSCRIPT</span><span class="lbl mono">overline · 11</span></div>
<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--border-subtle);padding:10px 0">
  <span style="font:var(--type-title)">Warfare Winter</span><span class="lbl mono">title · 14/600</span></div>
<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--border-subtle);padding:10px 0">
  <span style="font:var(--type-body)">January black ice</span><span class="lbl mono">body · 14/400</span></div>
<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--border-subtle);padding:10px 0">
  <span style="font:var(--type-meta)">6/4557</span><span class="lbl mono">meta · 13</span></div>
</div></body></html>

<!-- @dsCard group="Spacing" viewport="700x300" name="4px scale" subtitle="Multiples of 4; 1/2px hairline exceptions" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--surface-canvas);color:var(--text-title);font-family:var(--font-mono);padding:20px}
  .row{display:flex;align-items:center;gap:12px}
  .wrap{display:flex;flex-wrap:wrap;gap:12px}
  .lbl{font-size:11px;color:var(--text-meta);letter-spacing:.04em}
  .mono{font-variant-numeric:tabular-nums}
</style></head><body><div style="display:flex;flex-direction:column;gap:8px">
<div class="row" style="gap:12px"><div style="width:56px" class="lbl mono">hair</div>
  <div style="height:16px;width:var(--space-hair);background:var(--accent);border-radius:2px;min-width:1px"></div>
  <div class="lbl mono" style="color:var(--text-faint)">1px</div></div>
<div class="row" style="gap:12px"><div style="width:56px" class="lbl mono">2xs</div>
  <div style="height:16px;width:var(--space-2xs);background:var(--accent);border-radius:2px;min-width:1px"></div>
